<style>
:root{--bg:#F6F7FB;--surface:#fff;--surface2:#F0F2F8;--ink:#0B1220;--text:#1F2637;--muted:#5B6478;--faint:#8A93A6;--line:#E3E7F0;--line2:#D5DAE6;--primary:#3D5AFE;--primary-soft:#E9EDFF;--ok:#0FA97A;--ok-soft:#DDF6EC;--err:#D9363E;--err-soft:#FDE6E7}
@media (prefers-color-scheme:dark){:root{--bg:#0A0F1A;--surface:#111827;--surface2:#161F31;--ink:#F3F6FC;--text:#DCE2EE;--muted:#9AA4BA;--faint:#6F7A91;--line:#232D42;--line2:#2E3A54;--primary:#7088FF;--primary-soft:#1B2450;--ok:#34D3A4;--ok-soft:#0F3328;--err:#FF7A80;--err-soft:#3D1A1D;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.7 "IBM Plex Sans Arabic","Instrument Sans",system-ui,sans-serif}
html[lang=en] body{font-family:"Instrument Sans","IBM Plex Sans Arabic",system-ui,sans-serif}
main{max-width:760px;margin:0 auto;padding:22px 16px 64px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;color:var(--ink);text-decoration:none;font-size:19px;direction:ltr}
.brand i{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,#3D5AFE,#22D3EE);color:#fff;display:grid;place-items:center;font-style:normal;font-size:16px}
.hbtn{border:1px solid var(--line2);background:var(--surface);color:var(--text);border-radius:9px;padding:6px 12px;font:inherit;font-size:14px;cursor:pointer;text-decoration:none}
.hero{padding:6px 2px 18px}
.hero h1{font-size:clamp(28px,6vw,40px);line-height:1.25;color:var(--ink);margin:0 0 8px;letter-spacing:-.01em}
.hero p{color:var(--muted);margin:0 0 14px;font-size:17px}
.perks{display:flex;flex-wrap:wrap;gap:8px}
.perks span{background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:4px 12px;font-size:14px;color:var(--text)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px 20px;margin-top:14px}
.card h2{font-size:19px;color:var(--ink);margin:0 0 4px}.card .sub{color:var(--muted);margin:0 0 14px;font-size:14.5px}
.step{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--primary);color:#fff;font-size:14px;font-weight:700;margin-inline-end:8px;vertical-align:2px}
.gbtn{display:inline-flex;align-items:center;gap:10px;height:48px;padding:0 18px;border-radius:12px;border:1px solid var(--line2);background:var(--surface);color:var(--ink);font:inherit;font-weight:700;cursor:pointer}
.gbtn svg{width:20px;height:20px}
.who{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--surface2);border-radius:12px;padding:10px 12px;font-size:14.5px}
.who b{color:var(--ink)}.who button{margin-inline-start:auto;background:none;border:0;color:var(--primary);font:inherit;font-size:14px;cursor:pointer;text-decoration:underline}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.f{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;min-width:0}
.f>span,.lg{font-weight:700;color:var(--ink);font-size:15px}.f small,.hint{color:var(--faint);font-size:13px;font-weight:400}
input[type=text],input[type=tel],input[type=url],input[type=number],textarea{width:100%;height:46px;border:1px solid var(--line2);border-radius:12px;padding:0 12px;font:inherit;font-size:15.5px;background:var(--surface);color:var(--ink)}
textarea{height:auto;min-height:90px;padding:10px 12px;resize:vertical}
input:focus,textarea:focus{outline:2px solid color-mix(in srgb,var(--primary) 40%,transparent);border-color:var(--primary)}
input.bad,.opts.bad,.drop.bad{border-color:var(--err)!important;outline-color:var(--err)}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;border-radius:12px}
.opts label{display:flex;gap:8px;align-items:center;border:1px solid var(--line2);border-radius:12px;padding:10px 12px;cursor:pointer;font-size:15px;background:var(--surface)}
.opts input{accent-color:var(--primary);margin:0}
.opts label:has(input:checked){border-color:var(--primary);background:var(--primary-soft);color:var(--ink);font-weight:600}
.opts label:has(input:focus-visible){outline:2px solid var(--primary)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg label{flex:1 1 90px;text-align:center;border:1px solid var(--line2);border-radius:12px;padding:9px 6px;cursor:pointer;font-size:14.5px;background:var(--surface)}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){border-color:var(--primary);background:var(--primary-soft);color:var(--ink);font-weight:700}
.seg label:has(input:focus-visible){outline:2px solid var(--primary)}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button{flex:1;height:42px;border:1px solid var(--line2);border-radius:11px;background:var(--surface);color:var(--muted);font:inherit;font-weight:600;cursor:pointer}
.tabs button[aria-pressed=true]{border-color:var(--primary);background:var(--primary-soft);color:var(--ink)}
.drop{border:2px dashed var(--line2);border-radius:14px;padding:22px 14px;text-align:center;cursor:pointer;color:var(--muted);transition:border-color .15s,background .15s}
.drop:hover,.drop.over{border-color:var(--primary);background:var(--primary-soft)}
.drop b{display:block;color:var(--ink);font-size:16px;margin-bottom:2px}
.file{display:flex;align-items:center;gap:10px;border:1px solid var(--line2);border-radius:12px;padding:10px 12px}
.file .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink);font-weight:600;direction:ltr;text-align:start}
.file button{background:none;border:0;color:var(--err);font:inherit;font-size:14px;cursor:pointer}
.bar{height:6px;border-radius:9px;background:var(--surface2);overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;width:0;background:var(--primary);transition:width .3s}
.consent{display:flex;gap:10px;align-items:flex-start;font-size:14.5px;margin:4px 0 16px}.consent input{margin-top:5px;accent-color:var(--primary);width:18px;height:18px}
.go{width:100%;height:52px;border:0;border-radius:13px;background:var(--primary);color:#fff;font:inherit;font-weight:700;font-size:17px;cursor:pointer}
.go:disabled{opacity:.6;cursor:progress}
.msg{padding:11px 14px;border-radius:12px;margin-top:12px;font-size:14.5px;background:var(--err-soft);color:var(--err)}
.done{text-align:center;padding:10px 4px}.done .ic{width:60px;height:60px;border-radius:50%;margin:0 auto 6px;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center;font-size:30px}
.done b{display:block;font-size:22px;color:var(--ink)}.done .ref{display:inline-block;margin-top:8px;background:var(--surface2);border-radius:9px;padding:3px 12px;font-weight:700;direction:ltr}
.mine{margin-top:8px;font-size:14px;color:var(--muted)}.mine div{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding:8px 0}
.foot{margin-top:18px;color:var(--faint);font-size:13px;text-align:center}.foot a{color:inherit}
[hidden]{display:none!important}
@media (max-width:560px){.grid{grid-template-columns:1fr}.card{padding:18px 14px}}
</style>
</head>

  <form class="card" id="form" hidden novalidate>

    <div class="grid">
      <label class="f"><span data-t="name"></span><input type="text" id="name" autocomplete="name" maxlength="120" required></label>

    </div>
    <label class="f"><span data-t="loc"></span><input type="text" id="loc" maxlength="120" data-ph="locP"></label>

    <div class="f"><span class="lg" id="role-l" data-t="role"></span><div class="opts" id="roles" role="radiogroup" aria-labelledby="role-l"></div></div>
    <label class="f" id="other-w" hidden><span data-t="other"></span><input type="text" id="other" maxlength="120" data-ph="otherP"></label>

    <div class="f"><span class="lg" id="yrs-l" data-t="years"></span><div class="seg" id="years" role="radiogroup" aria-labelledby="yrs-l"></div></div>
    <div class="f"><span class="lg" id="wt-l" data-t="wtype"></span><div class="seg" id="wtype" role="radiogroup" aria-labelledby="wt-l"></div></div>
    <div class="grid">
      <label class="f"><span><span data-t="hours"></span> <small data-t="opt"></small></span><input type="number" id="hours" min="1" max="80" dir="ltr" inputmode="numeric"></label>
      <label class="f"><span><span data-t="rate"></span> <small data-t="opt"></small></span><input type="text" id="rate" maxlength="80" data-ph="rateP"></label>
    </div>
    <label class="f"><span><span data-t="skills"></span> <small data-t="opt"></small></span><input type="text" id="skills" maxlength="400" data-ph="skillsP"></label>

    <div class="f"><span class="lg" data-t="cv"></span>
      <div class="tabs" role="group"><button type="button" data-cv="file" aria-pressed="true" data-t="cvFile"></button><button type="button" data-cv="link" aria-pressed="false" data-t="cvLink"></button></div>
      <div id="cv-file"><input type="file" id="file" accept=".pdf,.doc,.docx,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document" hidden>
        <div class="drop" id="drop" role="button" tabindex="0"><b data-t="dropT"></b><span data-t="dropS"></span></div>
        <div class="file" id="picked" hidden><span aria-hidden="true">📄</span><span class="nm" id="fname"></span><button type="button" id="unpick" data-t="remove"></button></div>
        <div class="bar" id="bar" hidden><i></i></div></div>
      <div id="cv-link" hidden><input type="url" id="cvurl" dir="ltr" maxlength="500" placeholder="https://drive.google.com/…"><small class="hint" data-t="linkH"></small></div>
    </div>
    <label class="f"><span><span data-t="port"></span> <small data-t="opt"></small></span><input type="url" id="port" dir="ltr" maxlength="500" placeholder="https://github.com/… · https://linkedin.com/in/…"></label>
    <label class="f"><span><span data-t="note"></span> <small data-t="opt"></small></span><textarea id="note" maxlength="2000" data-ph="noteP"></textarea></label>
    <label class="consent"><input type="checkbox" id="consent"><span><span data-t="consent"></span> <a href="../privacy.html" target="_blank" data-t="privacy"></a></span></label>
    <button class="go" id="go" type="submit" data-t="send"></button>
    <div class="msg" id="err" role="alert" hidden></div>
  </form>

  <section class="card" id="done" hidden><div class="done"><div class="ic">✓</div><b data-t="thanks"></b><p class="sub" data-t="thanksS"></p><span class="ref" id="ref"></span></div>
    <p style="text-align:center;margin:14px 0 0"><button class="hbtn" id="again" type="button" data-t="again"></button></p></section>
  <section class="card" id="mine-c" hidden><h2 data-t="mineT"></h2><div class="mine" id="mine"></div></section>

      send: "Send application", sending: "Sending…", uploading: "Uploading your file…", thanks: "Application received! 🎉", thanksS: "We'll review it and reach out on WhatsApp or e-mail when there's a fit. Your reference:",
      updated: "Your application for this field was updated", again: "Apply for another field", mineT: "Your applications", foot: "HUDERA AI · Remote work",
      st: { received: "Received ✓", interview: "Interview 📅", hired: "Hired 🎉", rejected: "Not a fit right now" },
      e: { name: "Enter your full name", phone: "Enter a valid mobile number with the country code (e.g. +20, +966)", role: "Choose your field", other: "Type your field", years: "Choose your years of experience", cv: "Upload your CV or paste a link",
        cvurl: "That link isn't valid; it must start with https://", port: "That portfolio link isn't valid", consent: "Please agree so we can review your application", type: "The file must be a PDF or Word document", size: "The file is larger than 5 MB",
        upload: "The file didn't upload. Try again or paste a link instead.", rate_limited: "You've applied several times today. Try again tomorrow.", careers_closed: "Applications are closed right now.", net: "Connection problem. Try again.",
        not_authenticated: "Your session ended. Sign in again.", cv_missing: "The file didn't upload. Upload it again.", generic: "Something went wrong. Try again." } } };
  const t = k => T[lang][k];
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const sb = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey, { global: { fetch: (u, o = {}) => { const h = new Headers(o.headers || {}); const k = cfg.supabaseAnonKey; if (k && !k.includes(".") && h.get("Authorization") === "Bearer " + k) h.delete("Authorization"); return fetch(u, { ...o, headers: h }); } },
    auth: { flowType: "pkce", detectSessionInUrl: true, persistSession: true, autoRefreshToken: true, storageKey: "hudera-auth" } });
  let info = { open: true, roles: [], mine: [] }, user = null, profile = null, cvMode = "file", file = null;
  const MAX = 5 * 1024 * 1024, TYPES = { "application/pdf": "pdf", "application/msword": "doc", "application/vnd.openxmlformats-officedocument.wordprocessingml.document": "docx" };

  function paint() {
    document.documentElement.lang = lang; document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
    $("#lang").textContent = lang === "ar" ? "English" : "عربي"; document.title = `${t("title")} · HUDERA AI`;
    $$("[data-t]").forEach(el => { el.textContent = t(el.dataset.t); });
    $$("[data-ph]").forEach(el => { el.placeholder = t(el.dataset.ph); });
    $("#perks").innerHTML = t("perks").map(p => `<span>${esc(p)}</span>`).join("");
    const sel = $("input[name=role]:checked")?.value, ys = $("input[name=yrs]:checked")?.value, wt = $("input[name=wt]:checked")?.value || "freelance";
    $("#roles").innerHTML = info.roles.map(r => `<label><input type="radio" name="role" value="${esc(r.key)}" ${r.key === sel ? "checked" : ""}>${esc(r[lang] || r.ar)}</label>`).join("");
    $("#years").innerHTML = Object.entries(t("Y")).map(([k, v]) => `<label><input type="radio" name="yrs" value="${k}" ${k === ys ? "checked" : ""}>${v}</label>`).join("");
    $("#wtype").innerHTML = Object.entries(t("W")).map(([k, v]) => `<label><input type="radio" name="wt" value="${k}" ${k === wt ? "checked" : ""}>${v}</label>`).join("");
    if (user) $("#who").innerHTML = `${user.user_metadata?.avatar_url ? `<img src="${esc(user.user_metadata.avatar_url)}" alt="" width="28" height="28" style="border-radius:50%" referrerpolicy="no-referrer">` : ""}<span>${t("signedAs")} <b dir="ltr">${esc(user.email)}</b></span><button type="button" id="out">${t("notYou")}</button>`;
    $("#out")?.addEventListener("click", async () => { await sb.auth.signOut(); location.reload(); });
    mine();
  }
  function mine() {
    const m = info.mine || [];
    $("#mine-c").hidden = !m.length;
    $("#mine").innerHTML = m.map(a => { const r = info.roles.find(x => x.key === a.role); return `<div><span>${esc(r ? r[lang] : a.role)} · <span dir="ltr">${esc(a.ref)}</span></span><b>${esc(t("st")[a.status] || a.status)}</b></div>`; }).join("");
  }
  function show() {
    $("#closed").hidden = info.open; $("#s-auth").hidden = !info.open || !!user; $("#form").hidden = !info.open || !user; $("#done").hidden = true;
  }
  async function load() {
    try { const { data, error } = await sb.rpc("careers_info"); if (error) throw error; info = data; } catch (e) { info = { open: true, roles: [], mine: [] }; }
    if (user) { try { const { data } = await sb.rpc("me"); profile = data?.profile || data; } catch (e) {} }
    paint(); show();
    if (user) { if (!$("#name").value) $("#name").value = profile?.full_name || user.user_metadata?.full_name || user.user_metadata?.name || ""; if (!$("#phone").value && profile?.phone) $("#phone").value = profile.phone; }
  }

  $("#lang").addEventListener("click", () => { lang = lang === "ar" ? "en" : "ar"; store.set("hudera-lang", lang); paint(); });
  $("#g-in").addEventListener("click", () => {
    try { sessionStorage.setItem("hudera-return", "/careers/"); } catch (e) {}
    sb.auth.signInWithOAuth({ provider: "google", options: { redirectTo: location.origin + "/careers/", queryParams: { prompt: "select_account" } } });
  });
  $("#roles").addEventListener("change", () => { $("#other-w").hidden = $("input[name=role]:checked")?.value !== "other"; $("#roles").classList.remove("bad"); });
  $$("[data-cv]").forEach(b => b.addEventListener("click", () => { cvMode = b.dataset.cv; $$("[data-cv]").forEach(x => x.setAttribute("aria-pressed", x === b)); $("#cv-file").hidden = cvMode !== "file"; $("#cv-link").hidden = cvMode !== "link"; }));
  const pick = f => {
    if (!f) return; const err = !TYPES[f.type] && !/\.(pdf|docx?)$/i.test(f.name) ? t("e").type : f.size > MAX ? t("e").size : "";
    if (err) { fail(err); return; } hideErr();
    file = f; $("#fname").textContent = f.name; $("#picked").hidden = false; $("#drop").hidden = true; $("#drop").classList.remove("bad");
  };
  $("#drop").addEventListener("click", () => $("#file").click());
  $("#drop").addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); $("#file").click(); } });
  $("#file").addEventListener("change", e => pick(e.target.files[0]));
  ["dragover", "dragenter"].forEach(ev => $("#drop").addEventListener(ev, e => { e.preventDefault(); $("#drop").classList.add("over"); }));
  ["dragleave", "drop"].forEach(ev => $("#drop").addEventListener(ev, e => { e.preventDefault(); $("#drop").classList.remove("over"); }));
  $("#drop").addEventListener("drop", e => pick(e.dataTransfer.files[0]));
  $("#unpick").addEventListener("click", () => { file = null; $("#file").value = ""; $("#picked").hidden = true; $("#drop").hidden = false; });
  $("#again").addEventListener("click", () => { $("#done").hidden = true; $("#form").hidden = false; $$("input[name=role]").forEach(x => { x.checked = false; }); file = null; $("#picked").hidden = true; $("#drop").hidden = false; $("#cvurl").value = ""; $("#form").scrollIntoView({ behavior: "smooth" }); });

  const hideErr = () => { $("#err").hidden = true; };
  function fail(m, el) { $("#err").textContent = m; $("#err").hidden = false; if (el) { el.classList.add("bad"); el.focus?.({ preventScroll: false }); el.scrollIntoView({ behavior: "smooth", block: "center" }); } }
  $("#form").addEventListener("input", e => e.target.classList?.remove("bad"));
  const isUrl = v => /^https?:\/\/[^\s/]+\.[^\s]+$/i.test(v);

  $("#form").addEventListener("submit", async e => {
    e.preventDefault(); hideErr(); const E = t("e");
    const name = $("#name").value.trim(), phone = $("#phone").value.trim(), role = $("input[name=role]:checked")?.value, other = $("#other").value.trim(), yrs = $("input[name=yrs]:checked")?.value;
    const cvurl = $("#cvurl").value.trim(), port = $("#port").value.trim();
    if (name.length < 2) return fail(E.name, $("#name"));
    if (phone.replace(/\D/g, "").length < 8) return fail(E.phone, $("#phone"));
    if (!role) return fail(E.role, $("#roles"));
    if (role === "other" && other.length < 2) return fail(E.other, $("#other"));
    if (!yrs) return fail(E.years, $("#years"));
    if (cvMode === "file" && !file) return fail(E.cv, $("#drop"));
    if (cvMode === "link" && !isUrl(cvurl)) return fail(cvurl ? E.cvurl : E.cv, $("#cvurl"));
    if (port && !isUrl(port)) return fail(E.port, $("#port"));
    if (!$("#consent").checked) return fail(E.consent, $("#consent"));
    const go = $("#go"); go.disabled = true;
    let cv_path = null;
    try {
      if (cvMode === "file") {
        go.textContent = t("uploading"); $("#bar").hidden = false; $("#bar i").style.width = "35%";
        const ext = TYPES[file.type] || file.name.split(".").pop().toLowerCase(), rnd = [...crypto.getRandomValues(new Uint8Array(8))].map(b => b.toString(16).padStart(2, "0")).join("");
        cv_path = `${user.id}/cv_${rnd}.${ext}`;
        const ctype = TYPES[file.type] ? file.type : Object.keys(TYPES).find(k => TYPES[k] === ext);
        const { error } = await sb.storage.from("cvs").upload(cv_path, file, { contentType: ctype, upsert: false });
        if (error) throw Object.assign(new Error(/size|large/i.test(error.message) ? E.size : /mime|type/i.test(error.message) ? E.type : E.upload), { shown: true });
        $("#bar i").style.width = "100%";
      }
      go.textContent = t("sending");
      const { data, error } = await sb.rpc("submit_application", { p: { full_name: name, phone, location: $("#loc").value.trim(), role, role_other: role === "other" ? other : null, years: yrs,
        work_type: $("input[name=wt]:checked")?.value || "freelance", hours_week: $("#hours").value ? +$("#hours").value : null, expected_rate: $("#rate").value.trim(), skills: $("#skills").value.trim(),
        portfolio_url: port || null, cv_path, cv_name: cvMode === "file" ? file.name.slice(0, 200) : null, cv_url: cvMode === "link" ? cvurl : null, note: $("#note").value.trim(), lang, consent: true } });
      if (error) { const code = String(error.message || "").split(/\s/)[0]; throw Object.assign(new Error(E[code] || E[{ invalid_phone: "phone", invalid_name: "name", invalid_years: "years", invalid_role: "role", cv_required: "cv", invalid_cv_url: "cvurl", invalid_portfolio_url: "port", consent_required: "consent" }[code]] || E.generic), { shown: true }); }
      $("#ref").textContent = data.ref; $("#form").hidden = true; $("#done").hidden = false;
      $("#done .sub").textContent = data.updated ? `${t("updated")} ·` : t("thanksS");
      $("#done").scrollIntoView({ behavior: "smooth", block: "center" });
      try { const r = await sb.rpc("careers_info"); if (!r.error) { info = r.data; mine(); } } catch (er) {}
    } catch (er) { fail(er.shown ? er.message : t("e").net); }
    finally { go.disabled = false; go.textContent = t("send"); setTimeout(() => { $("#bar").hidden = true; $("#bar i").style.width = "0"; }, 600); }
  });

  (async () => {
    paint();
    const { data } = await sb.auth.getSession();
    if (qs.has("code")) history.replaceState(null, "", location.pathname + (qs.get("lang") ? `?lang=${qs.get("lang")}` : ""));
    try { sessionStorage.removeItem("hudera-return"); } catch (e) {}
    user = data.session?.user || null;
    sb.auth.onAuthStateChange((ev, s) => { if (ev === "SIGNED_OUT") { user = null; show(); } else if (s?.user && !user) { user = s.user; load(); } });
    await load();
  })();
})();
</script>
</body>
</html>
