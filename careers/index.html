<style>
:root{--bg:#F6F7FB;--surface:#fff;--surface2:#F0F2F8;--ink:#0B1220;--text:#1F2637;--muted:#5B6478;--faint:#8A93A6;--line:#E3E7F0;--line2:#D5DAE6;--primary:#3D5AFE;--primary-soft:#E9EDFF;--ok:#0FA97A;--ok-soft:#DDF6EC;--err:#D9363E;--err-soft:#FDE6E7}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.7 "IBM Plex Sans Arabic","Instrument Sans",system-ui,sans-serif}
html[lang=en] body{font-family:"Instrument Sans","IBM Plex Sans Arabic",system-ui,sans-serif}
main{max-width:760px;margin:0 auto;padding:22px 16px 64px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;color:var(--ink);text-decoration:none;font-size:19px;direction:ltr}
.brand i{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,#3D5AFE,#22D3EE);color:#fff;display:grid;place-items:center;font-style:normal;font-size:16px}
.hbtn{border:1px solid var(--line2);background:var(--surface);color:var(--text);border-radius:9px;padding:6px 12px;font:inherit;font-size:14px;cursor:pointer;text-decoration:none}
.hero{padding:6px 2px 18px}
.hero h1{font-size:clamp(28px,6vw,40px);line-height:1.25;color:var(--ink);margin:0 0 8px;letter-spacing:-.01em}
.hero p{color:var(--muted);margin:0 0 14px;font-size:17px}
.perks{display:flex;flex-wrap:wrap;gap:8px}
.perks span{background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:4px 12px;font-size:14px;color:var(--text)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px 20px;margin-top:14px}
.card h2{font-size:19px;color:var(--ink);margin:0 0 4px}.card .sub{color:var(--muted);margin:0 0 14px;font-size:14.5px}
.step{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--primary);color:#fff;font-size:14px;font-weight:700;margin-inline-end:8px;vertical-align:2px}
.gbtn{display:inline-flex;align-items:center;gap:10px;height:48px;padding:0 18px;border-radius:12px;border:1px solid var(--line2);background:var(--surface);color:var(--ink);font:inherit;font-weight:700;cursor:pointer}
.gbtn svg{width:20px;height:20px}
.who{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--surface2);border-radius:12px;padding:10px 12px;font-size:14.5px}
.who b{color:var(--ink)}.who button{margin-inline-start:auto;background:none;border:0;color:var(--primary);font:inherit;font-size:14px;cursor:pointer;text-decoration:underline}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.f{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;min-width:0}
.f>span,.lg{font-weight:700;color:var(--ink);font-size:15px}.f small,.hint{color:var(--faint);font-size:13px;font-weight:400}
input[type=text],input[type=tel],input[type=url],input[type=number],textarea{width:100%;height:46px;border:1px solid var(--line2);border-radius:12px;padding:0 12px;font:inherit;font-size:15.5px;background:var(--surface);color:var(--ink)}
textarea{height:auto;min-height:90px;padding:10px 12px;resize:vertical}
input:focus,textarea:focus{outline:2px solid color-mix(in srgb,var(--primary) 40%,transparent);border-color:var(--primary)}
input.bad,.opts.bad,.drop.bad{border-color:var(--err)!important;outline-color:var(--err)}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;border-radius:12px}
.opts label{display:flex;gap:8px;align-items:center;border:1px solid var(--line2);border-radius:12px;padding:10px 12px;cursor:pointer;font-size:15px;background:var(--surface)}
.opts input{accent-color:var(--primary);margin:0}
.opts label:has(input:checked){border-color:var(--primary);background:var(--primary-soft);color:var(--ink);font-weight:600}
.opts label:has(input:focus-visible){outline:2px solid var(--primary)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg label{flex:1 1 90px;text-align:center;border:1px solid var(--line2);border-radius:12px;padding:9px 6px;cursor:pointer;font-size:14.5px;background:var(--surface)}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){border-color:var(--primary);background:var(--primary-soft);color:var(--ink);font-weight:700}
.seg label:has(input:focus-visible){outline:2px solid var(--primary)}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button{flex:1;height:42px;border:1px solid var(--line2);border-radius:11px;background:var(--surface);color:var(--muted);font:inherit;font-weight:600;cursor:pointer}
.tabs button[aria-pressed=true]{border-color:var(--primary);background:var(--primary-soft);color:var(--ink)}
.drop{border:2px dashed var(--line2);border-radius:14px;padding:22px 14px;text-align:center;cursor:pointer;color:var(--muted);transition:border-color .15s,background .15s}
.drop:hover,.drop.over{border-color:var(--primary);background:var(--primary-soft)}
.drop b{display:block;color:var(--ink);font-size:16px;margin-bottom:2px}
.file{display:flex;align-items:center;gap:10px;border:1px solid var(--line2);border-radius:12px;padding:10px 12px}
.file .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink);font-weight:600;direction:ltr;text-align:start}
.file button{background:none;border:0;color:var(--err);font:inherit;font-size:14px;cursor:pointer}
.bar{height:6px;border-radius:9px;background:var(--surface2);overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;width:0;background:var(--primary);transition:width .3s}
.consent{display:flex;gap:10px;align-items:flex-start;font-size:14.5px;margin:4px 0 16px}.consent input{margin-top:5px;accent-color:var(--primary);width:18px;height:18px}
.go{width:100%;height:52px;border:0;border-radius:13px;background:var(--primary);color:#fff;font:inherit;font-weight:700;font-size:17px;cursor:pointer}
.go:disabled{opacity:.6;cursor:progress}
.msg{padding:11px 14px;border-radius:12px;margin-top:12px;font-size:14.5px;background:var(--err-soft);color:var(--err)}
.done{text-align:center;padding:10px 4px}.done .ic{width:60px;height:60px;border-radius:50%;margin:0 auto 6px;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center;font-size:30px}
.done b{display:block;font-size:22px;color:var(--ink)}.done .ref{display:inline-block;margin-top:8px;background:var(--surface2);border-radius:9px;padding:3px 12px;font-weight:700;direction:ltr}
.mine{margin-top:8px;font-size:14px;color:var(--muted)}.mine div{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding:8px 0}
.foot{margin-top:18px;color:var(--faint);font-size:13px;text-align:center}.foot a{color:inherit}
.jobs{display:flex;flex-direction:column;gap:10px}
.job{border:1px solid var(--line2);border-radius:14px;background:var(--surface)}
.job>summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.job>summary::-webkit-details-marker{display:none}
.job>summary b{color:var(--ink);font-size:16px;flex:1 1 220px}
.job>summary small{color:var(--muted);font-size:13px;flex-basis:100%}
.job>summary::after{content:"+";font-weight:700;color:var(--primary);font-size:20px;line-height:1}
.job[open]>summary::after{content:"–"}
.tier{font-size:12px;font-weight:700;border-radius:99px;padding:1px 10px;white-space:nowrap}
.tier.urgent{background:var(--err-soft);color:var(--err)}.tier.project{background:var(--primary-soft);color:var(--primary)}
.jb{padding:0 14px 14px;border-top:1px solid var(--line)}
.jb p{margin:10px 0 6px;color:var(--text)}
.jb h3{font-size:14px;color:var(--ink);margin:10px 0 4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips span{background:var(--surface2);border-radius:99px;padding:2px 10px;font-size:13.5px}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.facts div{background:var(--surface2);border-radius:10px;padding:8px 10px;font-size:14px}.facts div span{display:block;color:var(--muted);font-size:12.5px}
.apply{margin-top:12px;height:44px;padding:0 18px;border:0;border-radius:11px;background:var(--primary);color:#fff;font:inherit;font-weight:700;cursor:pointer}
@media (max-width:560px){.facts{grid-template-columns:1fr}}
[hidden]{display:none!important}
@media (max-width:560px){.grid{grid-template-columns:1fr}.card{padding:18px 14px}}
</style>

    if (role === "other" && other.length < 2) return fail(E.other, $("#other"));
    if (!yrs) return fail(E.years, $("#years"));
    if (cvMode === "file" && !file) return fail(E.cv, $("#drop"));
    if (cvMode === "link" && !isUrl(cvurl)) return fail(cvurl ? E.cvurl : E.cv, $("#cvurl"));
    if (port && !isUrl(port)) return fail(E.port, $("#port"));
    if (!$("#consent").checked) return fail(E.consent, $("#consent"));
    const go = $("#go"); go.disabled = true;
    let cv_path = null;
    try {
      if (cvMode === "file") {
        go.textContent = t("uploading"); $("#bar").hidden = false; $("#bar i").style.width = "35%";
        const ext = TYPES[file.type] || file.name.split(".").pop().toLowerCase(), rnd = [...crypto.getRandomValues(new Uint8Array(8))].map(b => b.toString(16).padStart(2, "0")).join("");
        cv_path = `${user.id}/cv_${rnd}.${ext}`;
        const ctype = TYPES[file.type] ? file.type : Object.keys(TYPES).find(k => TYPES[k] === ext);
        const { error } = await sb.storage.from("cvs").upload(cv_path, file, { contentType: ctype, upsert: false });
        if (error) throw Object.assign(new Error(/size|large/i.test(error.message) ? E.size : /mime|type/i.test(error.message) ? E.type : E.upload), { shown: true });
        $("#bar i").style.width = "100%";
      }
      go.textContent = t("sending");
      const { data, error } = await sb.rpc("submit_application", { p: { full_name: name, phone, location: $("#loc").value.trim(), role, role_other: role === "other" ? other : null, years: yrs,
        work_type: $("input[name=wt]:checked")?.value || "freelance", hours_week: $("#hours").value ? +$("#hours").value : null, expected_rate: $("#rate").value.trim(), skills: $("#skills").value.trim(),
        portfolio_url: port || null, cv_path, cv_name: cvMode === "file" ? file.name.slice(0, 200) : null, cv_url: cvMode === "link" ? cvurl : null, note: $("#note").value.trim(), lang, consent: true } });
      if (error) { const code = String(error.message || "").split(/\s/)[0]; throw Object.assign(new Error(E[code] || E[{ invalid_phone: "phone", invalid_name: "name", invalid_years: "years", invalid_role: "role", cv_required: "cv", invalid_cv_url: "cvurl", invalid_portfolio_url: "port", consent_required: "consent" }[code]] || E.generic), { shown: true }); }
      $("#ref").textContent = data.ref; $("#form").hidden = true; $("#done").hidden = false;
      $("#done .sub").textContent = data.updated ? `${t("updated")} ·` : t("thanksS");
      $("#done").scrollIntoView({ behavior: "smooth", block: "center" });
      try { const r = await sb.rpc("careers_info"); if (!r.error) { info = r.data; mine(); } } catch (er) {}
    } catch (er) { fail(er.shown ? er.message : t("e").net); }
    finally { go.disabled = false; go.textContent = t("send"); setTimeout(() => { $("#bar").hidden = true; $("#bar i").style.width = "0"; }, 600); }
  });

  (async () => {
    paint();
    const { data } = await sb.auth.getSession();
    if (qs.has("code")) history.replaceState(null, "", location.pathname + (qs.get("lang") ? `?lang=${qs.get("lang")}` : ""));
    try { sessionStorage.removeItem("hudera-return"); } catch (e) {}
    user = data.session?.user || null;
    sb.auth.onAuthStateChange((ev, s) => { if (ev === "SIGNED_OUT") { user = null; show(); } else if (s?.user && !user) { user = s.user; load(); } });
    await load();
  })();
})();
</script>
</body>
</html>
