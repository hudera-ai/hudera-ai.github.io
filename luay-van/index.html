function submit(repId, type, payload) {
  if (S.offline[repId]) { (S.pend[repId] = S.pend[repId] || []).push({ type, payload }); save(); toast(`💾 ${type === "inv" ? "الفاتورة" : type === "rct" ? "سند القبض" : "المرتجع"} <b>محفوظ على الموبايل</b> — ينرفع للنظام أول ما يرجع النت.`); return; }
  applyOp(type, payload); save();
}
function applyOp(type, p) {
  if (type === "inv") { const inv = postInvoice(S, p); S.lastLive = inv.id; toast(`🧾 فاتورة <b>${inv.id}</b> بقيمة ${jd(inv.total)} (${inv.pay}) — <b>نزلت في الحسابات</b>`); }
  if (type === "rct") { const rc = postReceipt(S, p); toast(`💵 سند قبض <b>${rc.id}</b> ${jd(p.amount)}${p.method === "شيك" ? " — الشيك ظاهر في شاشة الشيكات" : ""}`); }
  if (type === "ret") { const rt = postReturn(S, p); toast(`↩︎ مرتجع <b>${rt.id}</b> بقيمة ${jd(rt.total)} — رجع لمخزون السيارة ونقص من الرصيد`); }
}
function syncQueue(repId) {
  const list = S.pend[repId] || []; S.offline[repId] = false; S.pend[repId] = [];
  list.forEach(o => applyOp(o.type, o.payload)); save();
  toast(`☁️ رجع النت: انرفعت <b>${list.length}</b> عملية للنظام.`);
}

    return head + `<div class="alert warn" style="background:var(--okb);color:#0A5C43">✓ وصلت الساعة ${fmtT(v.in)} — الموقع مطابق لعنوان ${CL()}</div>

  if (repSel.mode === "ns") return head + `<h3>زيارة بدون بيع</h3><p class="mut sm">اختار السبب (يوصل للمدير):</p>` + NOSALE.map(x => `<button class="li" style="width:100%;cursor:pointer;text-align:right" data-ns="${esc(x)}"><span class="sp"><b>${esc(x)}</b></span>‹</button>`).join("");

document.addEventListener("click", e => {
  const scr = $("#scr"); if (!scr || !scr.contains(e.target)) return;
  const t = e.target.closest("button,[data-ns]"); if (!t || !S.me) return;
  const me = rep(S.me), D = S.day[me.id];
  if (t.id === "back") { if (repSel && repSel.mode !== "home") repSel.mode = "home"; else repSel = null; cart = []; repDraw(); }
  else if (t.id === "checkin") {
    const c = cust(repSel.c); const from = livePos(me.id);
    D.track.push([...from, now()]); D.track.push([...c.pos, now()]); D.live = { from: c.pos, to: c.pos, t0: now(), t1: now() };
    D.visits.push({ cust: c.id, in: now(), out: null, sale: false, reason: null, gps: true }); save(); toast(`📍 تسجيل وصول عند <b>${esc(c.name)}</b>`); repDraw();
  }
  else if (t.id === "checkout") {
    const v = D.visits.find(x => x.cust === repSel.c && x.out == null); v.out = now();
    if (!v.sale && !v.reason) v.reason = "زيارة بدون تسجيل سبب";
    save(); repSel = null; toast("✓ انتهت الزيارة"); repDraw();
  }
  else if (t.dataset.m) { repSel.mode = t.dataset.m; cart = []; payType = "نقدي"; repDraw(); }
  else if (t.dataset.q) { const id = t.dataset.q, d = +t.dataset.d; let l = cart.find(x => x.item === id); if (!l) { l = { item: id, qty: 0, price: item(id).price }; cart.push(l); }
    l.qty = Math.max(0, l.qty + d); if (repSel.mode === "inv") l.qty = Math.min(l.qty, S.stock[me.van][id]); cart = cart.filter(x => x.qty > 0); repDraw(); }
  else if (t.dataset.pay) { payType = t.dataset.pay; repDraw(); }
  else if (t.id === "saveInv") {
    const isRet = repSel.mode === "ret", c = cust(repSel.c), lines = cart.map(l => ({...l})), v = D.visits.find(x => x.cust === c.id && x.out == null);
    if (isRet) submit(me.id, "ret", { rep: me.id, cust: c.id, lines, time: now(), date: iso(0) });
    else { if (v) v.sale = true; submit(me.id, "inv", { rep: me.id, cust: c.id, lines, pay: payType, time: now(), date: iso(0), src: "تطبيق المندوب" }); }
    save(); repSel.mode = "home"; cart = []; repDraw();
  }
  else if (t.id === "saveRct") {
    const amt = parseFloat($("#rAmt").value); if (!(amt > 0)) { toast("اكتب المبلغ"); return; }
    const c = cust(repSel.c);
    submit(me.id, "rct", { rep: me.id, cust: c.id, amount: amt, method: payType, cheque: payType === "شيك" ? { no: $("#cNo").value, bank: $("#cBank").value, due: $("#cDue").value } : null, time: now(), date: iso(0) });
    repSel.mode = "home"; repDraw();
  }
  else if (t.dataset.ns) { const v = D.visits.find(x => x.cust === repSel.c && x.out == null); v.sale = false; v.reason = t.dataset.ns; v.out = now();

function svgMap(reps, custs, W, H, labels) {
  const pts = [WH, ...custs.map(c => c.pos), ...reps.flatMap(r => S.day[r.id].track.map(p => [p[0], p[1]]))];
  const la = pts.map(p => p[0]), lo = pts.map(p => p[1]);
  const mnA = Math.min(...la) - .006, mxA = Math.max(...la) + .006, mnO = Math.min(...lo) - .008, mxO = Math.max(...lo) + .008;
  const sc = Math.min(W/(mxO-mnO), H/(mxA-mnA)), ox = (W - (mxO-mnO)*sc)/2, oy = (H - (mxA-mnA)*sc)/2;
  const P = p => [ox + (p[1]-mnO)*sc, oy + (mxA-p[0])*sc];
  let g = `<rect width="${W}" height="${H}" fill="#EEF2F7"/>`;
  for (let i = 1; i < 10; i++) g += `<line x1="${W*i/10}" y1="0" x2="${W*i/10}" y2="${H}" stroke="#E2E7EF"/><line x1="0" y1="${H*i/10}" x2="${W}" y2="${H*i/10}" stroke="#E2E7EF"/>`;
  if (labels) Object.entries(AREAS).forEach(([n, p]) => { const [x, y] = P(p); if (x > 0 && x < W && y > 0 && y < H) g += `<text x="${x}" y="${y-14}" text-anchor="middle" font-size="13" fill="#8A93A6" font-weight="600">${n}</text>`; });
  reps.forEach(r => { const D = S.day[r.id]; g += `<polyline fill="none" stroke="${r.color}" stroke-width="3.5" stroke-opacity=".8" stroke-linejoin="round" points="${D.track.map(p => P(p).join(",")).join(" ")}"/>`;
    D.stops.forEach(s => { const [x, y] = P(s.at); g += `<circle cx="${x}" cy="${y}" r="16" fill="#E5484D" fill-opacity=".25" stroke="#E5484D"/>`; }); });
  custs.forEach(c => { const v = S.day[c.rep].visits.find(x => x.cust === c.id), [x, y] = P(c.pos); g += `<circle cx="${x}" cy="${y}" r="5.5" fill="${v ? (v.sale ? "#0FA97A" : "#F59E0B") : "#B8C0D2"}" stroke="#fff" stroke-width="2"/>`; });
  { const [x, y] = P(WH); g += `<rect x="${x-9}" y="${y-9}" width="18" height="18" rx="4" fill="#0B1220"/><text x="${x}" y="${y+24}" text-anchor="middle" font-size="12" font-weight="700" fill="#0B1220">المستودع</text>`; }
  reps.forEach(r => { const [x, y] = P(livePos(r.id)); g += `<circle cx="${x}" cy="${y}" r="10" fill="${r.color}" stroke="#fff" stroke-width="3"/><text x="${x}" y="${y-15}" text-anchor="middle" font-size="12.5" font-weight="700" fill="${r.color}">${esc(r.name)}</text>`; });
  return `<svg class="svgmap" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">${g}</svg>`;
}

    <label class="f"><span>اسم الشركة (يظهر على الفواتير والتقارير والتطبيق)</span><input id="cn" value="${esc(S.company)}"></label>
    <div class="f"><span>لون النظام</span><div class="row">${["#3D5AFE","#0FA97A","#B4232A","#7C3AED","#0B7285","#C2410C","#0B1220"].map(c => `<button class="swatch ${S.color === c ? "on" : ""}" style="background:${c}" data-col="${c}"></button>`).join("")}</div></div>
    <label class="f"><span>بتسمّي عملاءك إيش؟</span><select id="cl">${["الزبون","العميل","المحل","النقطة"].map(x => `<option ${S.custLabel === x ? "selected" : ""}>${x}</option>`).join("")}</select></label>
    <h3 style="margin-top:14px">الوحدات (شغّل اللي بتحتاجه بس)</h3>
    ${M.map(([k, t, d]) => `<div class="switch"><button class="tg ${S.mods[k] ? "on" : ""}" data-mod="${k}" aria-label="${t}"></button><span><b>${t}</b><small>${d}</small></span></div>`).join("")}
  </div><div>
    <div class="card"><h3>وكمان بنقدر نعمل لك</h3><ul style="margin:0;padding-right:18px">
      <li>شاشة فاتورة بنفس ترتيب «حساباتي» اللي متعوّد عليه.</li><li>تقارير بأسماء وأعمدة إنت بتختارها، تنطبع أو تنزل Excel.</li>
      <li>أسعار مختلفة لكل زبون أو منطقة، وعروض وخصومات.</li><li>صلاحيات لكل موظف: المندوب يشوف زبائنه بس، والمحاسب ما بيعدّل فاتورة بعد ما تتسجل.</li>
      <li>نقل بياناتك من «حساباتي»: الزبائن والأصناف والأرصدة والشيكات المفتوحة.</li><li>ربط طلبات واتساب ووكيل المكالمات بنفس النظام: الطلب يروح لمندوب المنطقة مباشرة.</li></ul></div>
    <div class="card" style="margin-top:14px;background:linear-gradient(135deg,#0B1220,#16245c);color:#fff;border:0"><h3 style="color:#fff">كيف بنشتغل معك</h3>
      <ol style="margin:0;padding-right:18px;color:#C9D1E3"><li>نقعد معك ونرسم الشاشات سوا.</li><li>نسلّمك المرحلة الأولى: التطبيق + التتبع + لوحة المدير.</li><li>المحاسبة ونقل البيانات من «حساباتي».</li><li>اشتراك شهري: استضافة ونسخ احتياطي وتحديثات ودعم.</li></ol>
      <a class="btn" style="margin-top:12px;background:#fff" href="https://wa.me/?text=${encodeURIComponent("بدي نكمل في نظام التوزيع والحسابات مع HUDERA")}" target="_blank" rel="noopener">💬 خلّينا نكمل</a></div>
  </div></div>`;
  $("#cn").oninput = e => { S.company = e.target.value || "شركتك"; save(); };
  $("#cl").onchange = e => { S.custLabel = e.target.value; save(); toast(`صار اسمهم «${esc(S.custLabel)}» في كل النظام`); };
  $$("[data-col]").forEach(b => b.onclick = () => { S.color = b.dataset.col; save(); applyBrand(); viewCustom(app); });
  $$("[data-mod]").forEach(b => b.onclick = () => { const k = b.dataset.mod; S.mods[k] = !S.mods[k]; save(); b.classList.toggle("on"); toast(S.mods[k] ? "✓ الوحدة اشتغلت" : "الوحدة اتطفت"); });
}

render();
</script>
</body>
</html>
