<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>HUDERA AI Admin</title>
<link rel="icon" type="image/png" href="../favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Instrument+Sans:wght@400..700&family=JetBrains+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#F6F7FB;--surface:#FFFFFF;--surface-2:#F0F2F8;--surface-3:#E9ECF5;
  --ink:#0B1220;--text:#1F2637;--muted:#5B6478;--faint:#8A93A6;--line:#E3E7F0;--line-2:#D5DAE6;
  --primary:#3D5AFE;--primary-ink:#2C46E6;--primary-soft:#E9EDFF;--on-primary:#FFFFFF;
  --mint:#0FA97A;--mint-soft:#DDF6EC;--amber:#B26A00;--amber-soft:#FFF0D6;--red:#D9363E;--red-soft:#FDE6E7;--violet:#6E56CF;--violet-soft:#EEEAFB;--sky:#0B83C5;--sky-soft:#E0F1FB;
  --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--grid:#E9ECF2;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);--shadow-lg:0 24px 48px -18px rgba(16,24,40,.28);
  --f:"Instrument Sans","IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",sans-serif;--f-d:"Bricolage Grotesque","IBM Plex Sans Arabic",system-ui,sans-serif;--f-m:"JetBrains Mono",ui-monospace,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:where(:not([data-theme="light"])){
  --bg:#0A0F1A;--surface:#111827;--surface-2:#161F31;--surface-3:#1C2740;--ink:#F3F6FC;--text:#DCE2EE;--muted:#9AA4BA;--faint:#6F7A91;--line:#232D42;--line-2:#2E3A54;
  --primary:#7088FF;--primary-ink:#8EA0FF;--primary-soft:#1B2450;--on-primary:#0A0F1A;--mint:#34D3A4;--mint-soft:#0F3328;--amber:#FFC34D;--amber-soft:#3A2C0B;--red:#FF7A80;--red-soft:#3D1A1D;--violet:#A996FF;--violet-soft:#29214A;--sky:#5CC2F2;--sky-soft:#0F2D40;
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--grid:#1E283B;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A0F1A;--surface:#111827;--surface-2:#161F31;--surface-3:#1C2740;--ink:#F3F6FC;--text:#DCE2EE;--muted:#9AA4BA;--faint:#6F7A91;--line:#232D42;--line-2:#2E3A54;
  --primary:#7088FF;--primary-ink:#8EA0FF;--primary-soft:#1B2450;--on-primary:#0A0F1A;--mint:#34D3A4;--mint-soft:#0F3328;--amber:#FFC34D;--amber-soft:#3A2C0B;--red:#FF7A80;--red-soft:#3D1A1D;--violet:#A996FF;--violet-soft:#29214A;--sky:#5CC2F2;--sky-soft:#0F2D40;
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--grid:#1E283B;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:14.5px/1.5 var(--f);min-height:100vh}
[hidden]{display:none!important}
a{color:var(--primary-ink)}
button,input,select,textarea{font:inherit;color:inherit}
svg.i{width:16px;height:16px;flex:none}
.mono{font-family:var(--f-m)}.muted{color:var(--muted)}.faint{color:var(--faint)}.small{font-size:12.5px}
/* shell */
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.side{background:var(--surface);border-inline-end:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;font:700 18px var(--f-d);color:var(--ink);padding:4px 8px 16px;text-decoration:none}
.brand i{width:30px;height:30px;border-radius:9px;background:var(--primary);color:#fff;display:grid;place-items:center;font-style:normal}
.brand small{font:500 11px var(--f-m);color:var(--faint);letter-spacing:.06em;text-transform:uppercase;display:block}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;color:var(--muted);text-decoration:none;font-weight:600}
.nav a:hover{background:var(--surface-2);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--primary-soft);color:var(--primary-ink)}
.nav .badge{margin-inline-start:auto;background:var(--red);color:#fff;border-radius:99px;font-size:11px;padding:1px 7px}
.side .me{margin-top:auto;border-top:1px solid var(--line);padding:12px 8px 0;display:flex;flex-direction:column;gap:8px}
.side .me b{color:var(--ink);font-size:13.5px;overflow-wrap:anywhere}
.side .me .row{display:flex;gap:6px;flex-wrap:wrap}
.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:16px 24px;border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:0;z-index:5}
.top h1{font:700 22px var(--f-d);color:var(--ink);margin:0;letter-spacing:-.01em}
.top .sp{flex:1}
.menu-btn{display:none}
.content{padding:22px 24px 48px;display:flex;flex-direction:column;gap:18px}
/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 14px;border-radius:9px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font-weight:600;font-size:13.5px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--faint)}.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
:root[data-theme="dark"] .btn.primary{color:var(--on-primary)}
@media (prefers-color-scheme:dark){:root:where(:not([data-theme="light"])) .btn.primary{color:var(--on-primary)}}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--red);border-color:color-mix(in srgb,var(--red) 40%,transparent)}
.input{height:36px;border:1px solid var(--line-2);border-radius:9px;background:var(--surface);padding:0 10px;min-width:0}
textarea.input{height:auto;min-height:120px;padding:9px 10px;resize:vertical;width:100%}
.input:focus,.btn:focus-visible,a:focus-visible{outline:2px solid var(--primary);outline-offset:1px}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:9px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:0 11px;height:34px;font-weight:600;font-size:13px;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--primary-soft);color:var(--primary-ink)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters label{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;min-width:0}
.card h2{font:700 16px var(--f-d);color:var(--ink);margin:0 0 4px}
.card .sub{font-size:12.5px;color:var(--muted);margin:0 0 12px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;min-width:0}
.kpi small{display:block;color:var(--muted);font-size:12.5px;font-weight:600}
.kpi b{display:block;font:700 28px var(--f-d);color:var(--ink);letter-spacing:-.02em;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi span{display:block;font-size:12px;color:var(--faint);margin-top:2px}
.kpi.alert b{color:var(--red)}
/* tables */
.tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:start;font-size:12px;color:var(--muted);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap;position:sticky;top:0}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}tbody tr.click:hover{background:var(--surface-2)}
td .t{color:var(--ink);font-weight:600}td .s{display:block;font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.num{text-align:end;font-variant-numeric:tabular-nums}
.pager{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.empty{padding:28px;text-align:center;color:var(--muted)}
/* chips */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;white-space:nowrap;background:var(--surface-2);color:var(--muted)}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.nodot::before{display:none}
.c-blue{background:var(--primary-soft);color:var(--primary-ink)}.c-mint{background:var(--mint-soft);color:var(--mint)}.c-amber{background:var(--amber-soft);color:var(--amber)}
.c-red{background:var(--red-soft);color:var(--red)}.c-violet{background:var(--violet-soft);color:var(--violet)}.c-sky{background:var(--sky-soft);color:var(--sky)}
/* charts */
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .ax{font:11px var(--f);fill:var(--faint)}
.chart .gl{stroke:var(--grid);stroke-width:1}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-bottom:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:3px;border-radius:2px;display:inline-block}
.legend i.sq{height:10px;width:10px;border-radius:3px}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--surface);border-radius:8px;padding:7px 10px;font-size:12px;line-height:1.45;white-space:nowrap;box-shadow:var(--shadow-lg);z-index:3;transform:translate(-50%,-110%)}
.tip b{display:block}
.hbars{display:flex;flex-direction:column;gap:8px}
.hbar{display:grid;grid-template-columns:minmax(0,1fr) 56px;gap:4px 10px;align-items:center;font-size:13px}
.hbar .lbl{color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar .val{text-align:end;font-variant-numeric:tabular-nums;color:var(--muted)}
.hbar .track{grid-column:1/-1;height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.hbar .fill{height:100%;background:var(--s1);border-radius:4px}
details.tv{margin-top:8px}details.tv summary{cursor:pointer;font-size:12.5px;color:var(--muted)}
/* detail pages */
.prof{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.av{width:56px;height:56px;border-radius:50%;object-fit:cover;background:var(--primary);color:#fff;display:grid;place-items:center;font:700 22px var(--f-d);flex:none}
.prof h2{font:700 22px var(--f-d);color:var(--ink);margin:0}
.kv{display:grid;grid-template-columns:150px minmax(0,1fr);gap:7px 12px;font-size:13.5px}
.kv dt{color:var(--muted)}.kv dd{margin:0;color:var(--ink);overflow-wrap:anywhere}
.tl{list-style:none;margin:0;padding:0;position:relative}
.tl li{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.tl .dot{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;background:var(--surface-2);color:var(--muted)}
.tl .dot svg{width:13px;height:13px}
.tl .k-contact .dot{background:var(--primary-soft);color:var(--primary-ink)}.tl .k-email .dot{background:var(--violet-soft);color:var(--violet)}
.tl .k-status .dot{background:var(--amber-soft);color:var(--amber)}.tl .srv .dot{background:var(--mint-soft);color:var(--mint)}
.tl time{color:var(--faint);font-size:12px;white-space:nowrap}
.tl .day{display:block;grid-column:1/-1;font-weight:700;color:var(--muted);font-size:12px;padding:12px 0 2px;border:0}
.feat{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.feat div{border:1px solid var(--line);border-radius:10px;padding:9px 11px;display:flex;flex-direction:column;gap:3px;font-size:13px}
.feat b{color:var(--ink)}
.notes{display:flex;flex-direction:column;gap:8px}
.note{background:var(--surface-2);border-radius:10px;padding:10px 12px;font-size:13.5px;white-space:pre-wrap;overflow-wrap:anywhere}
.note small{display:block;color:var(--faint);margin-top:4px}
.msg{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--surface-2);border-radius:10px;padding:12px 14px;color:var(--ink)}
.form-row{display:flex;gap:8px;flex-wrap:wrap;align-items:end}
.form-row label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);font-weight:600}
.stack{display:flex;flex-direction:column;gap:10px}
.err{background:var(--red-soft);color:var(--red);border-radius:10px;padding:10px 12px}
.ok{background:var(--mint-soft);color:var(--mint);border-radius:10px;padding:10px 12px}
/* modal */
.scrim{position:fixed;inset:0;background:rgba(8,12,24,.5);z-index:50;display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);border-radius:16px;box-shadow:var(--shadow-lg);width:min(620px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:20px;display:flex;flex-direction:column;gap:12px}
.modal h2{font:700 19px var(--f-d);color:var(--ink);margin:0}
/* gate */
.gate{min-height:100vh;display:grid;place-items:center;padding:24px}
.gate .card{max-width:440px;width:100%;padding:28px;display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.gate h1{font:700 24px var(--f-d);color:var(--ink);margin:0}
.toast{position:fixed;bottom:18px;inset-inline-start:50%;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:10px;z-index:60;font-size:13.5px;box-shadow:var(--shadow-lg)}
[dir="rtl"] .toast{transform:translateX(50%)}
.skel{height:90px;border-radius:14px;background:linear-gradient(90deg,var(--surface-2),var(--surface-3),var(--surface-2));background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  .side{position:fixed;inset-block:0;inset-inline-start:0;width:250px;z-index:40;transform:translateX(-105%);transition:transform .2s;box-shadow:var(--shadow-lg)}
  [dir="rtl"] .side{transform:translateX(105%)}
  .side.open{transform:none!important}
  .menu-btn{display:inline-flex}
  .g2{grid-template-columns:1fr}
  .top{padding:12px 16px}.content{padding:16px 16px 40px}
  .kv{grid-template-columns:1fr}.kv dt{margin-top:6px}
}
@media (max-width:520px){.g4,.g3{grid-template-columns:1fr 1fr}.kpi b{font-size:22px}}
.tl .s{display:block;font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.tl b{margin-inline-end:6px}
#view:focus{outline:none}
.side{align-self:start}

</style>
</head>
<body>
<div id="app"><div class="gate"><div class="card"><p class="muted">Loading…</p></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const HUDERA_CONFIG = {"supabaseUrl": "", "supabaseAnonKey": ""};
/* HUDERA AI · admin dashboard. Every number comes from the admin_* database functions,
   which check the signed-in person's staff role on the server. */
"use strict";
const cfg = typeof HUDERA_CONFIG !== "undefined" ? HUDERA_CONFIG : {};
const TZ = "Asia/Riyadh";
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const store = { get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} } };
let LANG = store.get("hudera-admin-lang") || "en";
const AR = {

  "Sign out": "تسجيل الخروج", "Website": "الموقع", "Last 7 days": "آخر 7 أيام", "Last 30 days": "آخر 30 يوماً", "Last 90 days": "آخر 90 يوماً", "From": "من", "To": "إلى",
  "Registered users": "المستخدمون المسجلون", "Total visitors": "إجمالي الزوار", "Visitors": "الزوار", "Sessions": "الجلسات", "Page views": "مشاهدات الصفحات",
  "Active users today": "النشطون اليوم", "New users today": "مستخدمون جدد اليوم", "New in 7 days": "جدد خلال 7 أيام", "New this month": "جدد هذا الشهر",
  "Contact requests": "طلبات التواصل", "Waiting for a reply": "بانتظار الرد", "Overdue follow-ups": "متابعات متأخرة", "Registration rate": "نسبة التسجيل",
  "Returning visitors": "زوار عائدون", "Signed-in sessions": "جلسات بحساب", "Anonymous sessions": "جلسات بدون حساب",
  "Visitors over time": "الزوار عبر الوقت", "Registrations over time": "التسجيلات عبر الوقت", "Daily active users": "المستخدمون النشطون يومياً",
  "Monthly active": "النشطون شهرياً", "Feature usage": "استخدام الميزات", "Engagement": "التفاعل", "Contact requests over time": "طلبات التواصل عبر الوقت",
  "Top pages": "أكثر الصفحات زيارة", "Traffic sources": "مصادر الزيارات", "Referrers": "المواقع المُحيلة", "Devices": "الأجهزة", "Browsers": "المتصفحات",
  "Retention by sign-up week": "الاحتفاظ حسب أسبوع التسجيل", "Requests by status": "الطلبات حسب الحالة", "Show as table": "عرض كجدول",
  "Search name, e-mail or phone": "ابحث بالاسم أو البريد أو الجوال", "All": "الكل", "Active": "نشط", "Inactive": "غير نشط", "Suspended": "موقوف", "Deleted": "محذوف",
  "Any phone": "أي جوال", "Has phone": "لديه جوال", "No phone": "بدون جوال", "Export CSV": "تصدير CSV", "Name": "الاسم", "E-mail": "البريد", "Phone": "الجوال",
  "Registered": "تاريخ التسجيل", "Last login": "آخر دخول", "Last activity": "آخر نشاط", "Status": "الحالة", "Recent features": "آخر الميزات", "Important actions": "إجراءات مهمة",
  "Contact": "التواصل", "Previous": "السابق", "Next": "التالي", "No results": "لا توجد نتائج", "Account": "الحساب", "Timeline": "الخط الزمني", "Load more": "تحميل المزيد",
  "Send e-mail": "إرسال بريد", "Used": "استُخدمت", "Not used": "لم تُستخدم", "Unknown": "غير معروف", "Recent sessions": "آخر الجلسات", "Pages visited": "الصفحات المزارة",
  "New": "جديد", "Pending": "قيد الانتظار", "Contacted": "تم التواصل", "In progress": "قيد التنفيذ", "Resolved": "تم الحل", "Closed": "مغلق", "Open": "مفتوحة",
  "Assigned to": "مسند إلى", "Follow-up": "موعد المتابعة", "Save": "حفظ", "Add note": "إضافة ملاحظة", "Internal notes": "ملاحظات داخلية", "Contact attempts": "محاولات التواصل",
  "Log attempt": "تسجيل محاولة", "Status history": "سجل الحالة", "Subject": "الموضوع", "Message": "الرسالة", "Send": "إرسال", "Cancel": "إلغاء", "Retry": "إعادة المحاولة",
  "Team": "الفريق", "Tracking": "التتبع", "E-mail service": "خدمة البريد", "Privacy": "الخصوصية", "General": "عام",
};
const t = s => (LANG === "ar" && AR[s]) || s;
const nf = n => (n == null || n === "" ? "—" : Number(n).toLocaleString("en-US"));

/* ---------------- charts (SVG, one y-axis, hover tooltip, table fallback) ---------------- */
function niceMax(v) { if (v <= 0) return 4; const p = 10 ** Math.floor(Math.log10(v)); const n = v / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p; }
function chart(el, { labels, series, type = "line", fmt = nf, height = 220 }) {
  const W = 640, H = height, L = 40, R = 10, T = 10, B = 26;
  const max = niceMax(Math.max(1, ...series.flatMap(s => s.values)));
  const n = labels.length, iw = W - L - R, ih = H - T - B;
  const x = i => L + (type === "bar" ? (i + 0.5) * iw / n : (n === 1 ? iw / 2 : i * iw / (n - 1)));
  const y = v => T + ih - (v / max) * ih;
  const ticks = [0, .25, .5, .75, 1].map(f => f * max);
  const every = Math.max(1, Math.ceil(n / 8));
  let svg = ticks.map(v => `<line class="gl" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${fmt(Math.round(v * 100) / 100)}</text>`).join("");
  svg += labels.map((l, i) => i % every === 0 ? `<text class="ax" x="${x(i)}" y="${H - 8}" text-anchor="middle">${esc(l)}</text>` : "").join("");
  if (type === "bar") {
    const bw = Math.max(2, Math.min(28, iw / n - 2)) / series.length;
    series.forEach((s, k) => s.values.forEach((v, i) => { if (v > 0) { const h = Math.max(1, ih - (y(v) - T)); const bx = x(i) - bw * series.length / 2 + k * bw;
      svg += `<path d="M${bx + 1},${T + ih} V${y(v) + Math.min(4, h)} q0,-4 4,-4 h${bw - 10 > 0 ? bw - 10 : 0} q4,0 4,4 V${T + ih} Z" fill="${s.color}"/>`; } }));
  } else {
    series.forEach(s => { svg += `<polyline fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="${s.values.map((v, i) => `${x(i)},${y(v)}`).join(" ")}"/>`;
      if (n <= 31) svg += s.values.map((v, i) => `<circle cx="${x(i)}" cy="${y(v)}" r="2.5" fill="${s.color}"/>`).join(""); });
  }
  svg += `<line class="xh" x1="0" x2="0" y1="${T}" y2="${T + ih}" stroke="var(--faint)" stroke-dasharray="3 3" visibility="hidden"/><rect x="${L}" y="${T}" width="${iw}" height="${ih}" fill="transparent" class="hit"/>`;
  el.innerHTML = `${series.length > 1 ? `<div class="legend">${series.map(s => `<span><i class="${type === "bar" ? "sq" : ""}" style="background:${s.color}"></i>${esc(t(s.name))}</span>`).join("")}</div>` : ""}
    <div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(series.map(s => t(s.name)).join(", "))}">${svg}</svg><div class="tip" hidden></div></div>
    <details class="tv"><summary>${t("Show as table")}</summary><div class="tbl-wrap" style="margin-top:6px;max-height:240px"><table><thead><tr><th></th>${series.map(s => `<th class="num">${esc(t(s.name))}</th>`).join("")}</tr></thead>
    <tbody>${labels.map((l, i) => `<tr><td>${esc(l)}</td>${series.map(s => `<td class="num">${fmt(s.values[i])}</td>`).join("")}</tr>`).join("")}</tbody></table></div></details>`;
  const svgEl = $("svg", el), tip = $(".tip", el), xh = $(".xh", el), wrap = $(".chart", el);
  $(".hit", el).addEventListener("pointermove", e => {
    const r = svgEl.getBoundingClientRect(), px = (e.clientX - r.left) * W / r.width;
    let i = type === "bar" ? Math.floor((px - L) / (iw / n)) : Math.round((px - L) / (n === 1 ? 1 : iw / (n - 1)));
    i = Math.max(0, Math.min(n - 1, i));
    xh.setAttribute("x1", x(i)); xh.setAttribute("x2", x(i)); xh.setAttribute("visibility", "visible");
    tip.hidden = false; tip.innerHTML = `<b>${esc(labels[i])}</b>${series.map(s => `${esc(t(s.name))}: ${fmt(s.values[i])}`).join("<br>")}`;
    tip.style.left = `${(x(i) / W) * r.width}px`; tip.style.top = `${(y(Math.max(...series.map(s => s.values[i]))) / H) * r.height}px`;
  });
  $(".hit", el).addEventListener("pointerleave", () => { tip.hidden = true; xh.setAttribute("visibility", "hidden"); });
  void wrap;
}
function hbars(el, rows, { label, value, fmt = nf, color = "var(--s1)", onClick } = {}) {

}

async function composeEmail({ user = null, request = null, onSent } = {}) {
  let rec; try { rec = await api("admin_email_recipient", { p_user: user, p_request: request }); } catch (e) { toast(e.message); return; }
  const token = crypto.randomUUID();
  document.body.insertAdjacentHTML("beforeend", `<div class="scrim" id="mail-scrim"><form class="modal" id="mail-form" role="dialog" aria-modal="true" aria-labelledby="mail-h">
    <h2 id="mail-h">${t("Send e-mail")}</h2>
    <div class="card" style="padding:12px 14px"><b dir="auto">${esc(rec.name || "—")}</b> <span dir="ltr">&lt;${esc(rec.email)}&gt;</span> ${rec.email_verified ? `<span class="chip c-mint">${LANG === "ar" ? "موثّق" : "verified"}</span>` : ""}
      <div class="small muted">${t("Phone")}: <span dir="ltr">${esc(rec.phone || "—")}</span> · ${LANG === "ar" ? "الأخبار" : "News"}: ${rec.marketing_consent ? "✓" : "✗"}${rec.request_ref ? ` · <span class="mono">${esc(rec.request_ref)}</span>` : ""}</div></div>
    <label class="stack small muted">${LANG === "ar" ? "النوع" : "Type"}<select class="input" id="m-cat"><option value="follow_up">${LANG === "ar" ? "متابعة (رد على طلب أو استفسار)" : "Follow-up (about their request or account)"}</option><option value="announcement" ${rec.marketing_consent ? "" : "disabled"}>${LANG === "ar" ? "إعلان (يتطلب موافقة على الأخبار)" : "Announcement (needs news consent)"}</option></select></label>
    <label class="stack small muted">${t("Subject")}<input class="input" id="m-sub" maxlength="150" required></label>
    <label class="stack small muted">${t("Message")}<textarea class="input" id="m-body" maxlength="8000" required dir="auto"></textarea></label>
    <p class="small faint">${LANG === "ar" ? "يُرسل من خلال مزود البريد. الحالة تتغير إلى «تم التسليم» فقط عندما يؤكد المزود ذلك." : "Sent through the e-mail provider. It shows “Delivered” only when the provider confirms delivery."}</p>
    <div id="m-err" class="err" hidden></div>
    <div class="filters" style="justify-content:flex-end"><button class="btn" type="button" id="m-cancel">${t("Cancel")}</button><button class="btn primary" type="submit" id="m-send">${t("Send")}</button></div></form></div>`);
  const close = () => $("#mail-scrim")?.remove();
  $("#m-cancel").addEventListener("click", close);
  $("#mail-scrim").addEventListener("click", e => { if (e.target.id === "mail-scrim") close(); });
  $("#mail-form").addEventListener("keydown", e => e.key === "Escape" && close());
  $("#m-sub").focus();
  $("#mail-form").addEventListener("submit", async e => {
    e.preventDefault(); const btn = $("#m-send"); btn.disabled = true; $("#m-err").hidden = true;
    try {
      const r = await api("admin_send_email", { p_subject: $("#m-sub").value, p_body: $("#m-body").value, p_user: user, p_request: request, p_category: $("#m-cat").value, p_client_token: token });
      close(); toast(LANG === "ar" ? `أُضيف للإرسال إلى ${r.to}` : `Queued for ${r.to}`);
      await runWorker(); onSent && onSent();
    } catch (x) { $("#m-err").textContent = x.message; $("#m-err").hidden = false; btn.disabled = false; }
  });
}
async function runWorker(body = {}) {
  try { const { data: s } = await sb.auth.getSession();
    const r = await fetch(`${cfg.supabaseUrl}/functions/v1/email-worker`, { method: "POST", headers: { apikey: cfg.supabaseAnonKey, authorization: `Bearer ${s.session.access_token}`, "content-type": "application/json" }, body: JSON.stringify(body) });
    return r.ok ? r.json() : { error: r.status };
  } catch (e) { return { error: "unreachable" }; }
}

/* ---------------- router + boot ---------------- */
function route() {
  if (!who) return;
  const [, sec, id] = location.hash.split("/");
  const first = NAV.find(n => can(n[3]))?.[0] || "overview";
  const go = { overview: viewOverview, users: id ? () => viewUser(id) : viewUsers, leads: id ? () => viewLead(id) : viewLeads, features: id ? () => viewFeature(decodeURIComponent(id)) : viewFeatures,
    emails: viewEmails, settings: viewSettings, audit: viewAudit }[sec];
  const need = NAV.find(n => n[0] === sec)?.[3];
  if (!go || (need && !can(need))) { location.hash = `#/${first}`; return; }
  go(); $("#view")?.focus({ preventScroll: true });
}
function gate(html) { $("#app").innerHTML = `<div class="gate"><div class="card">${html}</div></div>`; }
async function boot() {
  const th = store.get("hudera-admin-theme"); if (th) document.documentElement.setAttribute("data-theme", th);
  document.documentElement.lang = LANG; document.documentElement.dir = LANG === "ar" ? "rtl" : "ltr";
  if (!cfg.supabaseUrl || !cfg.supabaseAnonKey) { gate(`<h1>HUDERA AI · Admin</h1><p class="muted">The backend is not connected yet. Add the Supabase project URL and anon key to <code>src/config.json</code> and rebuild (see backend/README.md).</p>`); return; }
  sb = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey, { auth: { flowType: "pkce", detectSessionInUrl: true, persistSession: true, autoRefreshToken: true, storageKey: "hudera-auth" } });
  const hadCode = new URLSearchParams(location.search).has("code");
  const { data } = await sb.auth.getSession();
  if (hadCode) history.replaceState(null, "", location.pathname + (sessionStorage.getItem("hudera-admin-return") || "#/overview"));
  if (!data.session) {
    gate(`<h1>HUDERA AI · Admin</h1><p class="muted">${LANG === "ar" ? "سجّل الدخول بحساب جوجل المضاف لفريق HUDERA." : "Sign in with the Google account that was added to the HUDERA team."}</p><button class="btn primary" id="g-in">${LANG === "ar" ? "تسجيل الدخول بجوجل" : "Sign in with Google"}</button><a class="small" href="../">← ${t("Website")}</a>`);
    $("#g-in").addEventListener("click", () => { try { sessionStorage.setItem("hudera-admin-return", location.hash || "#/overview"); } catch (e) {}
      sb.auth.signInWithOAuth({ provider: "google", options: { redirectTo: location.origin + location.pathname, queryParams: { prompt: "select_account" } } }); });
    return;
  }
  try { who = await api("admin_whoami"); } catch (e) { gate(failBox(e)); return; }
  if (!who.role) {
    gate(`<h1>${LANG === "ar" ? "لا توجد صلاحية" : "No admin access"}</h1><p class="muted">${LANG === "ar" ? "حسابك" : "Your account"} <b dir="ltr">${esc(data.session.user.email)}</b> ${LANG === "ar" ? "ليس ضمن فريق الإدارة. اطلب من المالك إضافتك من الإعدادات ← الفريق." : "is not on the admin team. Ask the owner to add you in Settings → Team."}</p><button class="btn" id="g-out">${t("Sign out")}</button><a class="small" href="../">← ${t("Website")}</a>`);
    $("#g-out").addEventListener("click", async () => { await sb.auth.signOut(); location.reload(); });
    return;
  }
  sb.auth.onAuthStateChange((evt) => { if (evt === "SIGNED_OUT") location.reload(); });
  shell(); window.addEventListener("hashchange", route); route();
}
// broken avatar → initial letter (no inline handlers)
document.addEventListener("error", e => { const im = e.target; if (im.tagName === "IMG" && im.dataset.ini != null) { const s = document.createElement("span"); s.className = im.className; s.textContent = im.dataset.ini; im.replaceWith(s); } }, true);
boot();
