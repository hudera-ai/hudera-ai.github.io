<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HUDERA Academy · التأسيس في الذكاء الاصطناعي العملي</title>
<meta name="description" content="دورة التأسيس في الذكاء الاصطناعي العملي من HUDERA Academy: 8 جلسات، وفيديوهات شرح، ولقاءات مباشرة عبر الإنترنت في مجموعة صغيرة، ومهام تُصحَّح، ومشروع نهائي وشهادة، مع ضمان استرداد المبلغ.">
<meta property="og:title" content="HUDERA Academy · التأسيس في الذكاء الاصطناعي العملي">
<meta property="og:description" content="من استخدام الذكاء الاصطناعي بالشكل الصحيح إلى بناء أداة تعمل به. 8 جلسات · لقاءات مباشرة وفيديوهات · شهادة.">
<meta property="og:image" content="https://hudera.ai/og.png">
<meta property="og:url" content="https://hudera.ai/academy/">
<link rel="canonical" href="https://hudera.ai/academy/">
<link rel="icon" type="image/png" href="../favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#F5F6FB;--surface:#fff;--surface2:#EFF1F8;--ink:#0B1220;--text:#1F2637;--muted:#5B6478;--faint:#8A93A6;--line:#E3E7F0;--line2:#D5DAE6;
  --primary:#3D5AFE;--primary-ink:#2C44D6;--primary-soft:#E9EDFF;--cyan:#06B6D4;--ok:#0FA97A;--ok-soft:#DDF6EC;--warn:#B7791F;--warn-soft:#FDF1DC;--err:#D9363E;--err-soft:#FDE6E7;
  --hero1:#0B1A4A;--hero2:#1B2E86;--radius:18px;--shadow:0 1px 2px rgba(11,18,32,.04),0 6px 24px rgba(11,18,32,.06)}
@media (prefers-color-scheme:dark){:root{--bg:#0A0F1A;--surface:#111827;--surface2:#172036;--ink:#F3F6FC;--text:#DCE2EE;--muted:#9AA4BA;--faint:#6F7A91;--line:#232D42;--line2:#2E3A54;
  --primary:#7088FF;--primary-ink:#9AACFF;--primary-soft:#1B2450;--ok:#34D3A4;--ok-soft:#0F3328;--warn:#F2B35B;--warn-soft:#3A2A10;--err:#FF7A80;--err-soft:#3D1A1D;--shadow:none;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.75 "IBM Plex Sans Arabic",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--primary-ink)}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}
header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:14px;height:62px}
.brand{display:flex;align-items:center;gap:9px;text-decoration:none;color:var(--ink);direction:ltr}
.brand i{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#3D5AFE,#22D3EE);color:#fff;display:grid;place-items:center;font:800 17px "Bricolage Grotesque",sans-serif;font-style:normal}
.brand b{font:800 18px "Bricolage Grotesque",sans-serif;letter-spacing:-.01em}.brand span{font:600 13px "Bricolage Grotesque",sans-serif;color:var(--muted);border-inline-start:1px solid var(--line2);padding-inline-start:8px}
nav.links{display:flex;gap:4px;margin-inline-start:auto;align-items:center}
nav.links a{padding:7px 11px;border-radius:10px;text-decoration:none;color:var(--muted);font-weight:600;font-size:15px}
nav.links a:hover,nav.links a[aria-current=page]{color:var(--ink);background:var(--surface2)}
.who{display:flex;align-items:center;gap:8px}.who img{width:30px;height:30px;border-radius:50%}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 16px;border-radius:12px;border:1px solid var(--line2);background:var(--surface);color:var(--ink);font:inherit;font-weight:700;font-size:15px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--primary)}.btn.sm{height:34px;padding:0 12px;font-size:14px;border-radius:10px}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}.btn.primary:hover{background:var(--primary-ink)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.big{height:52px;padding:0 24px;font-size:17px;border-radius:14px}
section{padding:46px 0}
h1,h2,h3{color:var(--ink);line-height:1.3;margin:0}
h2.sec{font-size:clamp(24px,4vw,32px);margin-bottom:6px}.lead{color:var(--muted);margin:0 0 22px;font-size:17px}
/* hero */
.hero{background:radial-gradient(1200px 500px at 85% -10%,#22D3EE33,transparent 60%),linear-gradient(160deg,var(--hero1),var(--hero2));color:#E8EDFF;padding:56px 0 64px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;inset:auto -10% -40% auto;width:520px;height:520px;border-radius:50%;border:1px solid #ffffff14;box-shadow:0 0 0 60px #ffffff08,0 0 0 120px #ffffff05}
.hero .tag{display:inline-flex;gap:8px;align-items:center;background:#ffffff14;border:1px solid #ffffff24;border-radius:99px;padding:4px 12px;font-size:14px;font-weight:600}
.hero h1{color:#fff;font-size:clamp(32px,6vw,54px);margin:14px 0 10px;letter-spacing:-.01em;max-width:780px}
.hero p{font-size:clamp(17px,2.4vw,20px);color:#C9D3FF;max-width:640px;margin:0 0 22px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:26px}.chips span{background:#ffffff12;border-radius:10px;padding:5px 12px;font-size:14.5px}
.hero .btn.primary{background:#fff;color:#1B2E86;border-color:#fff}.hero .btn.primary:hover{background:#E9EDFF}
.hero .btn.out{background:transparent;color:#fff;border-color:#ffffff55}
.hero .row{display:flex;gap:10px;flex-wrap:wrap;position:relative;z-index:1}
/* cards & grids */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow)}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.outcome{display:flex;gap:12px;align-items:flex-start}.outcome i{flex:none;width:30px;height:30px;border-radius:9px;background:var(--primary-soft);color:var(--primary-ink);display:grid;place-items:center;font-style:normal;font-weight:800}
.how{counter-reset:h}.how .card{position:relative}.how .card:before{counter-increment:h;content:counter(h);position:absolute;top:16px;inset-inline-end:18px;font:800 40px "Bricolage Grotesque";color:var(--line2)}
.how b{display:block;color:var(--ink);font-size:17px;margin:4px 0}.how p{margin:0;color:var(--muted);font-size:15px}.how .ic{font-size:26px}
/* curriculum */
.mod{border:1px solid var(--line);border-radius:16px;background:var(--surface);margin-bottom:10px;overflow:hidden}
.mod summary{list-style:none;cursor:pointer;display:flex;gap:14px;align-items:center;padding:16px 18px}
.mod summary::-webkit-details-marker{display:none}
.mod .num{flex:none;width:42px;height:42px;border-radius:12px;background:var(--surface2);display:grid;place-items:center;font:800 18px "Bricolage Grotesque";color:var(--primary-ink)}
.mod[open] .num{background:var(--primary);color:#fff}
.mod summary b{display:block;color:var(--ink);font-size:17px}.mod summary small{color:var(--muted);font-size:14px}
.mod summary .chev{margin-inline-start:auto;color:var(--faint);transition:transform .2s}.mod[open] .chev{transform:rotate(180deg)}
.mod .body{padding:0 18px 18px 18px;border-top:1px solid var(--line)}
.mod ul{margin:12px 0 0;padding:0;list-style:none}.mod li{display:flex;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:15px}.mod li:last-child{border:0}
.mod li .m{margin-inline-start:auto;color:var(--faint);font-size:13.5px;white-space:nowrap}
.taskline{margin-top:10px;background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:8px 12px;font-size:14.5px;font-weight:600}
/* levels */
.levels{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.lv{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:center;position:relative}
.lv .badge{width:46px;height:46px;border-radius:14px;margin:0 auto 8px;display:grid;place-items:center;font:800 18px "Bricolage Grotesque";color:#fff;background:linear-gradient(135deg,#94A3B8,#64748B)}
.lv:nth-child(2) .badge{background:linear-gradient(135deg,#22D3EE,#0891B2)}.lv:nth-child(3) .badge{background:linear-gradient(135deg,#7088FF,#3D5AFE)}
.lv:nth-child(4) .badge{background:linear-gradient(135deg,#A78BFA,#7C3AED)}.lv:nth-child(5) .badge{background:linear-gradient(135deg,#FBBF24,#D97706)}
.lv b{display:block;color:var(--ink)}.lv small{color:var(--muted);font-size:13px;line-height:1.5;display:block}
.lv.me{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}.lv.off{opacity:.55}
/* packages */
.pkg{display:flex;flex-direction:column;gap:6px;position:relative}
.pkg.pop{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft),var(--shadow)}
.pkg .flag{position:absolute;top:-12px;inset-inline-start:18px;background:var(--primary);color:#fff;border-radius:99px;padding:2px 12px;font-size:13px;font-weight:700}
.pkg h3{font-size:19px}.pkg .pnote{color:var(--muted);font-size:14px;margin:0}
.price{display:flex;align-items:baseline;gap:6px;margin:8px 0 2px;direction:ltr;justify-content:flex-end}
[dir=rtl] .price{justify-content:flex-start;flex-direction:row-reverse}
.price b{font:800 40px "Bricolage Grotesque";color:var(--ink)}.price span{color:var(--muted);font-weight:600}
.egp{color:var(--faint);font-size:14px;margin:0 0 6px}
.pkg ul{list-style:none;padding:0;margin:6px 0 14px;flex:1}.pkg li{padding:5px 0;font-size:15px;display:flex;gap:8px}.pkg li:before{content:"✓";color:var(--ok);font-weight:800}
.persess{font-size:13.5px;color:var(--muted);background:var(--surface2);border-radius:9px;padding:4px 10px;display:inline-block;margin-bottom:6px}
/* cohort */
.cohort{display:flex;flex-wrap:wrap;gap:14px;align-items:center}.cohort .dates{display:flex;flex-wrap:wrap;gap:6px}
.cohort .dates span{background:var(--surface2);border-radius:9px;padding:3px 10px;font-size:13.5px}
.seats{font-weight:700;color:var(--ok)}.seats.low{color:var(--warn)}
.inst{display:flex;gap:16px;align-items:center}.inst .av{width:72px;height:72px;border-radius:20px;background:linear-gradient(135deg,#3D5AFE,#22D3EE);display:grid;place-items:center;color:#fff;font:800 28px "Bricolage Grotesque";flex:none}
.faq details{border-bottom:1px solid var(--line);padding:12px 0}.faq summary{cursor:pointer;font-weight:700;color:var(--ink)}.faq p{margin:8px 0 0;color:var(--muted)}
footer{border-top:1px solid var(--line);padding:26px 0;color:var(--faint);font-size:14px}footer .wrap{display:flex;gap:14px;flex-wrap:wrap;justify-content:space-between}footer a{color:inherit}
/* forms */
.f{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;min-width:0}.f>span,.lg{font-weight:700;color:var(--ink);font-size:15px}.f small,.hint{color:var(--faint);font-size:13px;font-weight:400}
input[type=text],input[type=tel],input[type=url],input[type=number],input[type=email],textarea,select{width:100%;height:46px;border:1px solid var(--line2);border-radius:12px;padding:0 12px;font:inherit;font-size:15.5px;background:var(--surface);color:var(--ink)}
textarea{height:auto;min-height:84px;padding:10px 12px;resize:vertical}
input:focus,textarea:focus,select:focus{outline:2px solid color-mix(in srgb,var(--primary) 40%,transparent);border-color:var(--primary)}
.bad{border-color:var(--err)!important}
.pick{display:grid;gap:8px}.pick label{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line2);border-radius:14px;padding:12px 14px;cursor:pointer;background:var(--surface)}
.pick input{accent-color:var(--primary);margin-top:6px}.pick label:has(input:checked){border-color:var(--primary);background:var(--primary-soft)}
.pick b{color:var(--ink)}.pick small{display:block;color:var(--muted)}.pick .pr{margin-inline-start:auto;font:800 18px "Bricolage Grotesque";color:var(--ink);direction:ltr;white-space:nowrap}
.seg{display:flex;flex-wrap:wrap;gap:6px}.seg label{flex:1 1 110px;text-align:center;border:1px solid var(--line2);border-radius:12px;padding:9px 6px;cursor:pointer;font-size:14.5px;background:var(--surface)}
.seg input{position:absolute;opacity:0;pointer-events:none}.seg label:has(input:checked){border-color:var(--primary);background:var(--primary-soft);color:var(--ink);font-weight:700}
.seg label:has(input:focus-visible),.pick label:has(input:focus-visible){outline:2px solid var(--primary)}
.paybox{background:var(--surface2);border-radius:14px;padding:14px 16px;margin-bottom:14px}.paybox .amt{font:800 26px "Bricolage Grotesque";color:var(--ink);direction:ltr;display:inline-block}
.paybox .acct{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line2);padding:8px 0;font-size:15px}.paybox .acct b{direction:ltr;color:var(--ink)}
.drop{border:2px dashed var(--line2);border-radius:14px;padding:18px 14px;text-align:center;cursor:pointer;color:var(--muted)}.drop:hover,.drop.over{border-color:var(--primary);background:var(--primary-soft)}
.drop b{display:block;color:var(--ink)}
.filepick{display:flex;align-items:center;gap:10px;border:1px solid var(--line2);border-radius:12px;padding:10px 12px}.filepick .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:ltr;text-align:start;font-weight:600;color:var(--ink)}
.consent{display:flex;gap:10px;align-items:flex-start;font-size:14.5px;margin:4px 0 16px}.consent input{margin-top:5px;accent-color:var(--primary);width:18px;height:18px}
.msg{padding:11px 14px;border-radius:12px;margin-top:12px;font-size:14.5px;background:var(--err-soft);color:var(--err)}.msg.ok{background:var(--ok-soft);color:var(--ok)}
.note{padding:12px 14px;border-radius:12px;background:var(--warn-soft);color:var(--warn);font-size:15px}
.gbtn{display:inline-flex;align-items:center;gap:10px;height:50px;padding:0 20px;border-radius:13px;border:1px solid var(--line2);background:var(--surface);color:var(--ink);font:inherit;font-weight:700;cursor:pointer}
.gbtn svg{width:20px;height:20px}
.narrow{max-width:720px;margin:0 auto}
.state{text-align:center;padding:24px 8px}.state .ic{width:64px;height:64px;border-radius:50%;margin:0 auto 10px;display:grid;place-items:center;font-size:30px;background:var(--surface2)}
.state b{display:block;font-size:22px;color:var(--ink)}
/* learner */
.dash-h{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.ring{--p:0;width:96px;height:96px;border-radius:50%;background:conic-gradient(var(--primary) calc(var(--p)*1%),var(--surface2) 0);display:grid;place-items:center;flex:none}
.ring>div{width:76px;height:76px;border-radius:50%;background:var(--surface);display:grid;place-items:center;text-align:center;line-height:1.1}
.ring b{font:800 22px "Bricolage Grotesque";color:var(--ink)}.ring small{font-size:11.5px;color:var(--muted)}
.lvpill{display:inline-flex;gap:6px;align-items:center;border-radius:99px;padding:3px 12px;font-weight:700;font-size:14px;background:var(--primary-soft);color:var(--primary-ink)}
.next{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:linear-gradient(135deg,var(--hero1),var(--hero2));color:#E8EDFF;border:0}
.next b{color:#fff;font-size:18px;display:block}.next .btn{background:#fff;color:#1B2E86;border-color:#fff}
.sess{display:flex;gap:14px;align-items:center;text-decoration:none;color:inherit}
.sess .num{flex:none;width:46px;height:46px;border-radius:13px;display:grid;place-items:center;font:800 19px "Bricolage Grotesque";background:var(--primary-soft);color:var(--primary-ink)}
.sess.lock .num{background:var(--surface2);color:var(--faint)}.sess.done .num{background:var(--ok-soft);color:var(--ok)}
.sess b{display:block;color:var(--ink);font-size:16.5px}.sess small{color:var(--muted);font-size:14px}
.sess .st{margin-inline-start:auto;text-align:end;font-size:13.5px;color:var(--muted);white-space:nowrap}
.list>*{border-bottom:1px solid var(--line);padding:14px 4px}.list>*:last-child{border:0}
.chip{display:inline-block;border-radius:99px;padding:2px 10px;font-size:13px;font-weight:700;background:var(--surface2);color:var(--muted)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}.chip.warn{background:var(--warn-soft);color:var(--warn)}.chip.blue{background:var(--primary-soft);color:var(--primary-ink)}.chip.err{background:var(--err-soft);color:var(--err)}
.tabs{display:flex;gap:6px;overflow-x:auto;border-bottom:1px solid var(--line);margin:16px 0 18px;scrollbar-width:none}
.tabs button{border:0;background:none;padding:10px 14px;font:inherit;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--primary)}
.player{background:#0B1220;border-radius:16px;overflow:hidden;aspect-ratio:16/9;display:grid;place-items:center;color:#9AA4BA;position:relative}
.player video,.player iframe{width:100%;height:100%;border:0;display:block;background:#000}
.player .soon{text-align:center;padding:20px}.player .soon b{display:block;color:#fff;font-size:18px}
.lng{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:10px}.lng>span{color:var(--muted);font-size:14px}
.lng button{border:1px solid var(--line2);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 14px;font:inherit;font-size:14px;font-weight:700;cursor:pointer}
.lng button:hover{border-color:var(--primary)}.lng button[aria-pressed="true"]{background:var(--primary);color:#fff;border-color:var(--primary)}.lng .cc{margin-inline-start:auto}
.player video::cue{font-size:1.05em;line-height:1.5;background:rgba(0,0,0,.72);color:#fff}
.lessons{display:grid;gap:8px}.lesson{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;background:var(--surface)}
.lesson[aria-current=true]{border-color:var(--primary);background:var(--primary-soft)}.lesson .ck{width:24px;height:24px;border-radius:50%;border:2px solid var(--line2);display:grid;place-items:center;flex:none;font-size:13px}
.lesson.d .ck{background:var(--ok);border-color:var(--ok);color:#fff}.lesson b{font-size:15px;color:var(--ink)}.lesson small{margin-inline-start:auto;color:var(--faint);white-space:nowrap}
.pts{margin:10px 0 0;padding-inline-start:20px}.pts li{margin:4px 0}
.vgrid{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:16px;align-items:start}
.rub{width:100%;border-collapse:collapse;font-size:15px}.rub td{padding:8px 6px;border-bottom:1px solid var(--line)}.rub td:last-child{text-align:end;white-space:nowrap;font-weight:700;color:var(--ink)}
.q{border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;background:var(--surface)}.q p{margin:0 0 8px;font-weight:700;color:var(--ink)}
.q label{display:flex;gap:10px;align-items:flex-start;padding:7px 10px;border-radius:10px;cursor:pointer}.q label:hover{background:var(--surface2)}.q input{accent-color:var(--primary);margin-top:6px}
.q label.right{background:var(--ok-soft)}.q label.wrong{background:var(--err-soft)}.q .why{margin-top:8px;font-size:14.5px;color:var(--muted);background:var(--surface2);border-radius:10px;padding:8px 12px}
.score{font:800 44px "Bricolage Grotesque";color:var(--ink)}
.tbl{width:100%;border-collapse:collapse;font-size:15px}.tbl th,.tbl td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:start}.tbl th{color:var(--muted);font-size:13.5px;font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.kpi{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.kpi small{display:block;color:var(--muted);font-size:13.5px}.kpi b{font:800 26px "Bricolage Grotesque";color:var(--ink)}
.cert{border:2px solid var(--primary);border-radius:18px;padding:22px;text-align:center;background:linear-gradient(180deg,var(--primary-soft),var(--surface))}
.skel{height:120px;border-radius:16px;background:linear-gradient(90deg,var(--surface2),var(--surface),var(--surface2));background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
/* register */

      <div class="card state"><div class="ic">🎉</div><b>تم تسجيلك${name ? " يا " + esc(name) : ""}</b>
        ${r.ref ? `<p style="margin:6px 0 0;color:var(--muted)">رقم التسجيل: <b dir="ltr" style="color:var(--ink)">${esc(r.ref)}</b></p>` : ""}<p style="color:var(--muted);margin:4px 0 0">سيتواصل معك فريقنا على واتساب خلال 48 ساعة لتأكيد المسار والموعد.</p></div>
      ${r.level ? `<div class="g2" style="margin-top:14px">
        <div class="card"><small style="color:var(--muted)">مستواك الحالي</small><div style="display:flex;align-items:baseline;gap:10px;margin:4px 0"><b style="font-size:24px;color:var(--ink)">${lv[0]}</b>${r.score != null ? `<span class="chip blue">${r.score} من 8</span>` : `<span class="chip">بحسب إجاباتك</span>`}</div><p style="margin:0;font-size:15px;color:var(--muted)">${lv[1]}</p></div>
        <div class="card" style="border-color:var(--primary)"><small style="color:var(--muted)">المسار المقترح لك</small><b style="display:block;font-size:20px;color:var(--ink);margin:4px 0">${esc(t.ar || "")}</b>
          <p style="margin:0 0 8px;font-size:15px;color:var(--muted)">${esc(t.for || "")}</p>${t.open ? `<span class="chip ok">التسجيل مفتوح الآن</span>` : `<span class="chip warn">قريباً · ستكون من أوائل من نتواصل معهم</span>`}</div></div>` : ""}
      <div class="row" style="margin-top:16px;gap:10px;flex-wrap:wrap">${t.open ? `<a class="btn primary big" href="#/course">اطّلع على الدورة والمنهج</a>` : `<a class="btn primary big" href="#/course">تعرّف على الأكاديمية</a>`}
        <a class="btn big" href="${wa}" target="_blank" rel="noopener">تواصل معنا على واتساب</a></div>
      <p style="margin-top:18px;font-size:14px;color:var(--faint)">المسار المقترح مبدئي، ويؤكده فريقنا معك بعد التواصل. <button class="btn sm ghost" type="button" id="rgn">تسجيل شخص آخر</button></p>
    </div></section>`;
    $("#rgn").addEventListener("click", () => { try { sessionStorage.removeItem(rgKey); } catch (e) {} Object.assign(rg, { step: 1, d: {}, order: null, token: null, res: null }); viewRegister(); });
  }

  /* ---------------------------------------------------------------- router */
  async function route() {
    const [, r = "", a, b] = location.hash.split("/");
    nav(); window.scrollTo(0, 0);
    try {
      if (r === "verify") return viewVerify(a ? decodeURIComponent(a) : "");
      if (r === "register") return viewRegister();
      if (r === "enroll") return viewEnroll(a);
      if ((r === "learn" || r === "s" || r === "progress") && !enrId) { location.hash = user ? "#/enroll" : "#/course"; return; }
      if (r === "learn") { await loadCourse(); return viewLearn(); }
      if (r === "s") { if (!course) await loadCourse(); return viewSession(a, b || "videos"); }
      if (r === "progress") { await loadCourse(); return viewProgress(); }
      if (r === "" && enrId) { location.hash = "#/learn"; return; }
      viewLanding();
    } catch (e) { app.innerHTML = `<section><div class="wrap narrow"><div class="msg">${errMsg(e)}</div></div></section>`; }
  }
  window.addEventListener("hashchange", route);
  (async () => {
    const qs = new URLSearchParams(location.search);
    const { data } = await sb.auth.getSession(); user = data.session?.user || null;
    if (qs.has("code")) history.replaceState(null, "", location.pathname + location.hash);
    let back = null; try { back = sessionStorage.getItem("academy-back"); sessionStorage.removeItem("academy-back"); sessionStorage.removeItem("hudera-return"); } catch (e) {}
    sb.auth.onAuthStateChange(async (ev, s) => { const was = user?.id; user = s?.user || null; if ((user?.id || null) !== (was || null)) { await loadCatalog().catch(() => {}); route(); } });
    try { await loadCatalog(); } catch (e) { if (location.hash.startsWith("#/register")) { route(); return; } app.innerHTML = `<section><div class="wrap narrow"><div class="msg">الأكاديمية غير متاحة حالياً. حاول بعد قليل.</div></div></section>`; return; }
    if (back && back !== location.hash) { location.hash = back; return; }
    route();
  })();
})();
</script>
