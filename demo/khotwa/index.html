ر متتاليين، ويُطلب منك الأساس أو الحد الأول."},{id:"t_physics",name_ar:"الفيزياء: قانون نيوتن الثاني",ease:2,recommendation_ar:"ارسم القوى المؤثرة في الجسم أولًا، ثم احسب القوة المحصلة: القوى التي في الاتجاه نفسه تُجمع، والمتعاكسة تُطرح. بعدها: التسارع = القوة المحصلة ÷ الكتلة.",consolidate_ar:"تدرّب على حساب القوة المحصلة قبل أي قسمة، في سؤالين فيهما قوة احتكاك.",challenge_ar:"جرّب مسائل فيها جسمان متصلان أو قوى مائلة، وابدأ دائمًا برسم القوى."},{id:"t_chem",name_ar:"الكيمياء: المول والكتلة المولية",ease:3,recommendation_ar:"احسب الكتلة المولية من الصيغة كاملة: اضرب الكتلة الذرية لكل عنصر في عدد ذراته (الرقم الصغير أسفل الرمز). ثم: الكتلة = عدد المولات × الكتلة المولية.",consolidate_ar:"ثبّت العلاقة بين الكتلة وعدد المولات والكتلة المولية بسؤالين، مرة من الكتلة إلى المولات ومرة بالعكس.",challenge_ar:"انتقل إلى الحسابات في المعادلات الموزونة، حيث تُستخدم نسب المولات بين المواد."},{id:"t_bio",name_ar:"الأحياء: الوراثة المندلية",ease:4,recommendation_ar:"ارسم مربع بانيت: اكتب أمشاج كل أب على أحد الضلعين، واملأ الخانات الأربع، ثم عُدّ الخانات التي تعطي الصفة المطلوبة. وفرّق دائمًا بين الطراز الجيني والطراز الشكلي.",consolidate_ar:"تدرّب على مربع بانيت في تلقيحين مختلفين، وحدّد في كل مرة الطراز الجيني والطراز الشكلي لكل خانة.",challenge_ar:"جرّب التلقيح الاختباري ومسائل الصفتين، فهي أكثر ما يحتاج إلى تنظيم."}],ld=[{id:"seq_used_n",skill_id:"t_math",what_ar:"ضربت الأساس في رتبة الحد (ن) بدل عدد الخطوات (ن − 1)؛ فالحد الأول موجود أصلًا، والخطوات تبدأ بعده.",lure_ar:"رتبة الحد مكتوبة في السؤال، فيبدو الضرب فيها مباشرًا، لكن الانتقال من الحد الأول إلى الحد العاشر يحتاج 9 خطوات فقط."},{id:"seq_forgot_first",skill_id:"t_math",what_ar:"ضربت الأساس في رتبة الحد ونسيت أن تبدأ من الحد الأول.",lure_ar:"ناتج الضرب قريب من الإجابة، لكن المتتابعة لا تبدأ من الصفر بل من حدّها الأول."},{id:"seq_add_then_multiply",skill_id:"t_math",what_ar:"جمعت الحد الأول والأساس ثم ضربت الناتج في رتبة الحد، مع أن الأساس وحده هو الذي يتكرر.",lure_ar:"الأعداد كلها ظاهرة في السؤال، فيبدو الجمع ثم الضرب استعمالًا لها جميعًا، لكن الحد الأول يُحسب مرة واحدة فقط."},{id:"seq_diff_not_divided",skill_id:"t_math",what_ar:"حسبت الفرق بين الحدين وتوقفت، ولم تقسمه على عدد الخطوات بينهما.",lure_ar:"الفرق {27 − 11 = 16} خطوة صحيحة في الحل، لذلك يبدو جوابًا نهائيًا."},{id:"seq_counted_terms",skill_id:"t_math",what_ar:"قسمت الفرق على عدد الحدود من الثالث إلى السابع (5) بدل عدد الخطوات بينها (4).",lure_ar:"من الحد الثالث إلى السابع خمسة حدود فعلًا، لكن بينها أربع قفزات فقط، والأساس هو طول القفزة الواحدة."},{id:"seq_middle_term",skill_id:"t_math",what_ar:"حسبت متوسط الحدين، وهذا هو الحد الخامس الواقع في منتصفهما، لا أساس المتتابعة.",lure_ar:"المتوسط عملية مألوفة مع عددين، وناتجه حد حقيقي في المتتابعة، لكنه ليس الأساس المطلوب."},{id:"newton_ignored_friction",skill_id:"t_physics",what_ar:"قسمت قوة السحب على الكتلة وأهملت قوة الاحتكاك؛ التسارع يُحسب من القوة المحصلة.",lure_ar:"قوة السحب أوضح قوة في السؤال، لكن الاحتكاك يعاكسها فيُنقص أثرها."},{id:"newton_added_opposing",skill_id:"t_physics",what_ar:"جمعت قوة السحب وقوة الاحتكاك مع أنهما متعاكستان؛ القوتان المتعاكستان تُطرحان.",lure_ar:"جمع القوى يبدو طبيعيًا، لكنه صحيح فقط عندما تكون القوى في الاتجاه نفسه."},{id:"newton_multiplied",skill_id:"t_physics",what_ar:"ضربت القوة في الكتلة بدل أن تقسمها عليها؛ التسارع = القوة المحصلة ÷ الكتلة.",lure_ar:"القانون يُكتب عادةً «القوة = الكتلة × التسارع»، فيعلق الضرب في الذهن، لكن المطلوب هنا التسارع."},{id:"newton_inverted",skill_id:"t_physics",what_ar:"قسمت الكتلة على القوة، والصحيح قسمة القوة على الكتلة.",lure_ar:"القسمة هي العملية الصحيحة، لكن ترتيب العددين معكوس."},{id:"newton_subtracted",skill_id:"t_physics",what_ar:"طرحت الكتلة من القوة، وهما كميتان مختلفتان لا تُطرح إحداهما من الأخرى.",lure_ar:"الطرح يعطي عددًا يبدو مقبولًا، لكن لا معنى لطرح كيلوجرامات من نيوتن."},{id:"newton_net_only",skill_id:"t_physics",what_ar:"حسبت القوة المحصلة (الكتلة × التسارع) وتوقفت، ونسيت أن قوة السحب يجب أن تتغلب على الاحتكاك أيضًا.",lure_ar:"{2 × 3 = 6} نيوتن خطوة صحيحة، لكنها القوة المحصلة لا قوة السحب."},{id:"newton_friction_wrong_sign",skill_id:"t_physics",what_ar:"طرحت الاحتكاك من القوة المحصلة، والصحيح أن تضيفه: قوة السحب = القوة المحصلة + الاحتكاك.",lure_ar:"الاحتكاك يُطرح عادةً، فيبدو طرحه هنا طبيعيًا، لكننا نبحث عن قوة السحب التي تغلّبت عليه."},{id:"newton_multiplied_all",skill_id:"t_physics",what_ar:"ضربت الأعداد الثلاثة معًا، والقوى تُجمع أو تُطرح ولا يُضرب بعضها في بعض.",lure_ar:"ضرب كل الأعداد الظاهرة يبدو استعمالًا لكل المعطيات، لكن الاحتكاك قوة تُضاف إلى القوة المحصلة."},{id:"mole_ignored_subscript",skill_id:"t_chem",what_ar:"حسبت الكتلة المولية بذرة واحدة من كل عنصر، وأهملت الرقم الصغير في الصيغة الذي يبيّن عدد الذرات.",lure_ar:"الرقم الصغير أسفل الرمز سهل أن يغيب عن النظر، لكنه يضاعف عدد الذرات وكتلتها."},{id:"mole_divided",skill_id:"t_chem",what_ar:"قسمت الكتلة المولية على عدد المولات بدل أن تضربها فيه؛ الكتلة = عدد المولات × الكتلة المولية.",lure_ar:"القسمة تبدو مناسبة لأن الوحدة «جم/مول» فيها خط كسر، لكن المطلوب هنا الكتلة لا عدد المولات."},{id:"mole_stopped_at_molar_mass",skill_id:"t_chem",what_ar:"حسبت الكتلة المولية وتوقفت، والسؤال يطلب كتلة عدد معيّن من المولات.",lure_ar:"الكتلة المولية رقم صحيح يظهر في منتصف الحل، لذلك يبدو جوابًا نهائيًا."},{id:"mole_multiplied_mass",skill_id:"t_chem",what_ar:"ضربت الكتلة في الكتلة المولية، والصحيح أن تقسمها عليها لتجد عدد المولات.",lure_ar:"الضرب في الكتلة المولية هو ما نفعله عند حساب الكتلة من عدد المولات، أما هنا فالاتجاه معكوس."},{id:"mole_inverted",skill_id:"t_chem",what_ar:"قسمت الكتلة المولية على الكتلة، والصحيح قسمة الكتلة على الكتلة المولية.",lure_ar:"القسمة هي العملية الصحيحة، لكن ترتيب العددين معكوس."},{id:"mole_subtracted",skill_id:"t_chem",what_ar:"طرحت الكتلة المولية من الكتلة، وعدد المولات يُحسب بالقسمة لا بالطرح.",lure_ar:"الطرح يعطي عددًا مقبولًا، لكن السؤال الحقيقي: كم مرة تتسع الكتلة للكتلة المولية؟ وهذا سؤال قسمة."},{id:"gen_gave_dominant",skill_id:"t_bio",what_ar:"أعطيت نسبة النباتات الطويلة (الصفة السائدة) بدل نسبة النباتات القصيرة المطلوبة.",lure_ar:"75% رقم مشهور في هذا التلقيح، لكنه نسبة misconception_id:"seq_used_n"},{text:"32",correct:!0},{text:"30",correct:!1,misconception_id:"seq_forgot_first"},{text:"80",correct:!1,misconception_id:"seq_add_then_multiply"}],solution_steps_ar:["من الحد الأول إلى الحد العاشر 9 خطوات، وفي كل خطوة نضيف الأساس 3.","الحد العاشر = الحد الأول + 9 × الأساس: {5 + 9 × 3 = 5 + 27 = 32}."],alt_explanation_ar:"اكتب الحدود واحدًا بعد الآخر بإضافة 3 في كل مرة: 5، 8، 11، 14، 17، 20، 23، 26، 29، 32. الحد العاشر هو 32.",difficulty:2,role:"diagnostic",...ze},{id:"td2",skill_id:"t_physics",type:"mcq",stem_ar:"يُسحب صندوق كتلته 5 كجم على سطح أفقي بقوة أفقية مقدارها 30 نيوتن، وتؤثر فيه قوة احتكاك مقدارها 10 نيوتن. ما مقدار تسارعه؟",figure:{kind:"force",mass:5,force:30,friction:10},options:[{text:"6 م/ث^2",correct:!1,misconception_id:"newton_ignored_friction"},{text:"8 م/ث^2",correct:!1,misconception_id:"newton_added_opposing"},{text:"4 م/ث^2",correct:!0},{text:"100 م/ث^2",correct:!1,misconception_id:"newton_multiplied"}],solution_steps_ar:["قوة السحب والاحتكاك متعاكستان، فالقوة المحصلة: {30 − 10 = 20} نيوتن.","التسارع = القوة المحصلة ÷ الكتلة: {20 ÷ 5 = 4} م/ث^2."],alt_explanation_ar:"تخيّل أن الاحتكاك «يستهلك» 10 نيوتن من قوة السحب، فيبقى 20 نيوتن تحرّك الصندوق فعلًا. كل 5 نيوتن تعطي هذا الصندوق تسارعًا مقداره 1 م/ث^2، إذن 20 نيوتن تعطيه 4 م/ث^2.",difficulty:2,role:"diagnostic",...ze},{id:"td3",skill_id:"t_chem",type:"mcq",stem_ar:"ما كتلة 0.5 مول من ثاني أكسيد الكربون [[CO_2]]؟ (الكتل الذرية: {[[C]] = 12}، {[[O]] = 16})",options:[{text:"14 جم",correct:!1,misconception_id:"mole_ignored_subscript"},{text:"22 جم",correct:!0},{text:"88 جم",correct:!1,misconception_id:"mole_divided"},{text:"44 جم",correct:!1,misconception_id:"mole_stopped_at_molar_mass"}],solution_steps_ar:["في جزيء [[CO_2]] ذرة كربون واحدة وذرتا أكسجين، فالكتلة المولية: {12 + 2 × 16 = 44} جم/مول.","الكتلة = عدد المولات × الكتلة المولية: {0.5 × 44 = 22} جم."],alt_explanation_ar:"0.5 مول يعني نصف مول، فكتلته نصف الكتلة المولية. والكتلة المولية 44 جم/مول، ونصفها 22 جم.",d ption_id:"seq_counted_terms"},{text:"4",correct:!0},{text:"19",correct:!1,misconception_id:"seq_middle_term"}],solution_steps_ar:["بين الحد الثالث والحد السابع {7 − 3 = 4} خطوات.","الفرق بين الحدين: {27 − 11 = 16}.","الأساس: {16 ÷ 4 = 4}."],alt_explanation_ar:"تحقّق بالكتابة: إذا كان الأساس 4 والحد الثالث 11، فالحدود بعده: 15، 19، 23، 27. والحد السابع فعلًا 27.",hints:["كل انتقال من حد إلى الذي يليه يضيف الأساس نفسه.","كم خطوة بين الحد الثالث والحد السابع؟ (ليس عدد الحدود)","بينهما 4 خطوات، ومجموعها {27 − 11 = 16}.","الأساس: {16 ÷ 4 = 4}."],difficulty:3,role:"practice",...ze},{id:"tp-physics-1",skill_id:"t_physics",type:"mcq",stem_ar:"تؤثر قوة محصلة مقدارها 12 نيوتن في جسم كتلته 3 كجم. ما تسارعه؟",options:[{text:"36 م/ث^2",correct:!1,misconception_id:"newton_multiplied"},{text:"0.25 م/ث^2",correct:!1,misconception_id:"newton_inverted"},{text:"4 م/ث^2",correct:!0},{text:"9 م/ث^2",correct:!1,misconception_id:"newton_subtracted"}],solution_steps_ar:["التسارع = القوة المحصلة ÷ الكتلة.","التسارع: {12 ÷ 3 = 4} م/ث^2."],alt_explanation_ar:"كل 3 نيوتن تعطي هذا الجسم تسارعًا مقداره 1 م/ث^2، وفي 12 نيوتن أربع مجموعات من 3، فالتسارع 4 م/ث^2.",hints:["تذكّر قانون نيوتن الثاني: القوة المحصلة = الكتلة × التسارع.","إذا عرفت القوة والكتلة، فبأي عملية تجد التسارع؟","التسارع = القوة ÷ الكتلة، أي {12 ÷ 3}.","التسارع: {12 ÷ 3 = 4} م/ث^2."],difficulty:1,role:"practice",...ze},{id:"tp-physics-2",skill_id:"t_physics",type:"mcq",stem_ar:"جسم كتلته 2 كجم يتحرك على سطح أفقي بتسارع 3 م/ث^2، وتؤثر فيه قوة احتكاك مقدارها 4 نيوتن. ما مقدار قوة السحب الأفقية؟",options:[{text:"6 نيوتن",correct:!1,misconception_id:"newton_net_only"},{text:"2 نيوتن",correct:!1,misconception_id:"newton_friction_wrong_sign"},{text:"10 نيوتن",correct:!0},{text:"24 نيوتن",correct:!1,misconception_id:"newton_multiplied_all"}],solution_steps_ar:["القوة المحصلة اللازمة لهذا التسارع: {2 × 3 = 6} نيوتن.","قوة السحب تتغلب على الاحتكاك وتوفّر القوة المحصلة معًا: {6 + 4 = 10} نيوتن."],alt_explanation_ar:"تحقّق بالعكس: إذا كانت
